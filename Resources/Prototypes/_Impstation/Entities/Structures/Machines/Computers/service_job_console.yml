- type: entity
  #Funky - Civilian instead of service contraband
  parent: [ BaseComputerCircuitboard, BaseCivilianContraband ]
  id: ServiceJobBoardComputerCircuitboard
  name: service event console computer board # Funky - Renamed job board
  description: A computer printed circuit board for a service job board computer.
  components:
  - type: Sprite
    state: cpu_service
  - type: ComputerBoard
    prototype: ComputerServiceJobBoard
