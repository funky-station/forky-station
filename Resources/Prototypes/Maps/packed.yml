- type: gameMap
  id: Packed
  mapName: 'Packed'
  mapPath: /Maps/_Funkystation/packed.yml
  minPlayers: 3
  maxPlayers: 55
  stations:
    Packed:
      stationProto: StandardNanotrasenStation
      components:
      - type: StationNameSetup
        mapNameTemplate: '{0} Packed {1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: 'VG'
      - type: StationEmergencyShuttle
        emergencyShuttlePath: /Maps/Shuttles/emergency_crimson.yml
      - type: StationJobs
        availableJobs: # 56 jobs total w/o latejoins & interns, 71 jobs total w/ latejoins & interns
          #command (7)
          Captain: [ 1, 1 ]
          Commandant: [ 1, 1 ]
          ChiefMedicalOfficer: [ 1, 1 ]
          ChiefEngineer: [ 1, 1 ]
          ResearchDirector: [ 1, 1 ]
          Quartermaster: [ 1, 1 ]
          CorporateLiaison: [ 1, 1 ]
          HospitalityDirector: [ 1, 1 ]
          #internal affairs (3 - 4)
          ExecutiveOfficer: [ 1, 1 ]
          Magistrate: [ 1, 1 ]
          InternalAffairsAgent: [ 2, 2 ]
          #service (8 - 10)
          Bartender: [ 1, 1 ]
          Botanist: [ 1, 2 ]
          Chef: [ 1, 1 ]
          Janitor: [ 1, 2 ]
          Chaplain: [ 1, 1 ]
          Librarian: [ 1, 1 ]
          ServiceWorker: [ 2, 2 ]
          #engineering (6)
          StationEngineer: [ 6, 6 ]
          TechnicalAssistant: [ 4, 4 ] #intern, not counted
          #medical (6)
          Chemist: [ 2, 2 ]
          MedicalDoctor: [ 3, 3 ]
          MedicalIntern: [ 3, 3 ] #intern, not counted
          Paramedic: [ 1, 1 ]
          Psychologist: [ 1, 1 ]
          #science (4)
          Scientist: [ 4, 4 ]
          ResearchAssistant: [ 3, 3 ] #intern, not counted
          #security (6)
          Warden: [ 1, 1 ]
          Lieutenant: [ 2, 2 ]
          SecurityOfficer: [ 4, 4 ]
          Detective: [ 1, 1 ]
          SecurityCadet: [ 3, 3 ] #intern, not counted
          Passenger: [ -1, -1 ] #infinite, not counted
          Lawyer: [ 1, 1 ]
          #supply (4)
          CargoTechnician: [ 4, 4 ]
          #civilian (3+)
          Clown: [ 1, 1 ]
          Mime: [ 1, 1 ]
          Musician: [ 1, 1 ]
          Reporter: [ 1, 1 ]
          #silicon (3)
          Borg: [ 2, 2 ]
