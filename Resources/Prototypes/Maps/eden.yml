- type: gameMap
  id: Eden
  mapName: 'Eden'
  mapPath: /Maps/_Funkystation/eden.yml
  minPlayers: 0
  maxPlayers: 70
  stations:
    Eden:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Eden Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'TG'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/_Funkystation/Shuttles/emergency_eden.yml
        - type: StationJobs
          availableJobs:
            #corporate
            CorporateLiaison: [ 1, 1 ]
            InternalAffairsAgent: [2, 2]
            #command
            Captain: [ 1, 1 ]
            ExecutiveOfficer: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            HospitalityDirector: [ 1, 1 ]
            #service
            Bartender: [ 1, 1 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            #engineering
            StationEngineer: [ 5, 6 ]
            TechnicalAssistant: [ 2, 2 ]
            #medical
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 4 ]
            Paramedic: [ 1, 1 ]
            Psychologist: [ 1, 1 ]
            MedicalIntern: [ 2, 2 ]
            #science
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 2 ]
            #aegis
            Commandant: [ 1, 1 ]
            Warden: [ 1, 1 ]
            Lieutenant: [2, 2]
            SecurityOfficer: [ 4, 4 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 2, 2 ]
            #legal
            Magistrate: [1, 1]
            Lawyer: [ 1, 1 ]
            #supply
            Botanist: [ 2, 2 ]
            CargoTechnician: [ 3, 4 ]
            Prisoner: [1, 1]
            #civilian
            Passenger: [ -1, -1 ]
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            Reporter: [ 1, 1 ]
            #silicon
            Borg: [ 3, 3 ]
