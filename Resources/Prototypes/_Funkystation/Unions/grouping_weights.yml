# each dept starts as its own union
# unions that dont have minMembers satisfied will just merge into the other union in order
# keeps doing that, so theoretically there can be a big ass union for everyone.
# canMerge: false is for unions like Sec.
# leaderItemSet: UnionRoleItemSetPrototype, lets us give union leaders cool stuff

- type: unionGrouping
  id: SecurityUnion
  department: Security
  canMerge: false

- type: unionGrouping
  id: MedicalUnion
  department: Medical
  minMembers: 3
  mergesWith: [ ScienceUnion, EngineeringUnion, CargoUnion, ServiceUnion, CivilianUnion ]

- type: unionGrouping
  id: ScienceUnion
  department: Science
  minMembers: 3
  mergesWith: [ MedicalUnion, EngineeringUnion, CargoUnion, ServiceUnion, CivilianUnion ]

- type: unionGrouping
  id: EngineeringUnion
  department: Engineering
  minMembers: 3
  mergesWith: [ CargoUnion, MedicalUnion, ScienceUnion, ServiceUnion, CivilianUnion ]

- type: unionGrouping
  id: CargoUnion
  department: Cargo
  minMembers: 3
  mergesWith: [ ServiceUnion, EngineeringUnion, MedicalUnion, ScienceUnion, CivilianUnion ]

- type: unionGrouping
  id: ServiceUnion
  department: Service
  displayInitial: S
  minMembers: 3
  mergesWith: [ CargoUnion, EngineeringUnion, MedicalUnion, ScienceUnion, CivilianUnion ]

- type: unionGrouping
  id: CivilianUnion
  department: Civilian
  minMembers: 3
  mergesWith: [ ServiceUnion, CargoUnion, EngineeringUnion, MedicalUnion, ScienceUnion ]
