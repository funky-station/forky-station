- type: constructionGraph
  id: PASPEAKER
  start: start
  graph:
  - node: start
    edges:
    - to: paspeakerFrame
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
      - material: Cable

  - node: paspeakerFrame
    entity: PASpeakerFrame
    edges:
    - to: paSpeaker
      steps:
      - tag: PASpeakerElectronics
        name: construction-graph-component-paspeaker-electronics
        icon:
          sprite: "Objects/Misc/module.rsi"
          state: "charger_APC"
        doAfter: 2
    - to: start
      completed:
      - !type:GivePrototype
        prototype: SheetSteel1
        amount: 2
      - !type:GivePrototype
        prototype: CableApcStack1
        amount: 1
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 2

  - node: paSpeaker
    entity: PARadioSpeaker
    edges:
    - to: paspeakerFrame
      completed:
      - !type:GivePrototype
        prototype: PASpeakerElectronics
        amount: 1
      steps:
      - tool: Prying
        doAfter: 4
