      Alive:
        Base: mouse-burnt
      Critical:
        Base: dead-burnt
      Dead:
        Base: splat-burnt
  - type: Item
    size: Tiny
    heldPrefix: burnt
  - type: IgnitionSource #Todo make this fucker light you on fire if you touch them
    temperature: 800
    ignited: true
  - type: FireProtection
    reduction: 1 #Its on fire constantly
  - type: PointLight
    color: Red
    radius: 5
    energy: 5
    netsync: false

#Special Cows

- type: entity
  name: chocolate cow
  parent: MobCow
  id: MobCowChocolate
  description: Moo.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: cow
      sprite: Mobs/Animals/cow.rsi
  - type: SolutionContainerManager
    solutions:
      udder:
        maxVol: 250
        reagents:
        - ReagentId: MilkChocolate
          Quantity: 30
  - type: Udder
    reagentId: MilkChocolate
    quantityPerUpdate: 25
    growthDelay: 30
  - type: Butcherable
    spawned:
    - id: FoodSnackChocolateBar
      amount: 5

- type: entity
  name: strawberry cow
  parent: MobCow
  id: MobCowStrawberry
