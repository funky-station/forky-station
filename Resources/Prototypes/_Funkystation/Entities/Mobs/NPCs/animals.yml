#Rainbow Mice

- type: entity
  parent: MobMouse
  id: MobMouseBlue
  components:
  - type: Sprite
    sprite: _FunkyStation/Mobs/Animals/mouse_blue.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: mouse-blue
  - type: SpriteMovement
    movementLayers:
      movement:
        state: mouse-moving-blue
    noMovementLayers:
      movement:
        state: mouse-blue
  - type: Clothing
    sprite: _FunkyStation/Mobs/Animals/mouse_blue.rsi
    equippedPrefix: blue
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mouse-blue
      Critical:
        Base: dead-blue
      Dead:
        Base: splat-blue
  - type: Item
    size: Tiny
    heldPrefix: blue

