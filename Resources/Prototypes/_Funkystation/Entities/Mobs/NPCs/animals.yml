      id: WeirdEggPlasma

- type: entity
  name: servant of Nar'sie
  parent: MobGoose
  id: MobGooseNarsie
  description: A damned beast that yearns for blood.
  suffix: EVIL
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goosenarsie
      sprite: _Funkystation/Mobs/Animals/goose.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goosenarsie
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.01
  - type: CombatMode
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 12
        Structural: 20
        Heat: 12
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-narsie-goose-name
    description: ghost-role-information-narsie-goose-description
    rules: ghost-role-information-narsie-goose-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true

- type: entity
  parent: BaseStructure
  id: GooseRune_drawing
  name: "goose rune"
  components:
  - type: Sprite
    sprite: _Funkystation/Mobs/Animals/goose.rsi
    state: GooseNarsieSummon
  - type: TimedSpawner
    prototypes:
    - MobGooseNarsie
    intervalSeconds: 1.8
    minimumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 2

# ported from funkystation to forky
- type: entity
  name: roingus
  description: Bounce!
  parent: MobMouse
  id: MobRoingus
  components:
  - type: Sprite
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", movement]
      state: roingus
      sprite: _Funkystation/Mobs/Animals/roingus.rsi
  - type: SpriteMovement
    movementLayers:
