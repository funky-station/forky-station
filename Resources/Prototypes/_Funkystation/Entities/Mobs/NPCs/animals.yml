    equippedPrefix: roingus
  - type: DamageStateVisuals
    states:
      Alive:
        Base: roingus
      Critical:
        Base: dead
      Dead:
        Base: splat
  - type: Item
    size: Tiny
    sprite: _Funkystation/Mobs/Animals/roingus.rsi
    heldPrefix: roingus
  - type: FoodSequenceElement
    entries:
      Burger: RoingusBurger
      Taco: RoingusTaco
      Skewer: RoingusSkewer

# M,eowl,,, :3
- type: entity
  name: meowl
  parent: [ SimpleMobBase, FlyingMobBase, BaseSlicingRefinable ]
  id: MobMeowl
  description: The peak of evolution, the most efficient pest hunter any side of the galaxy. Considered highly invasive on every planet.
  components:
  - type: InteractionPopup
    successChance: 0.9
    interactSuccessString: petting-success-meowl
    interactFailureString: petting-failure-meowl
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/cat_meow.ogg
  - type: Grammar
    attributes:
      proper: true
      gender: epicene
  - type: ToolRefinable
    refineResult:
    - id: FoodMeat
      amount: 1
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 5
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 7
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: meowl
      sprite: _Funkystation/Mobs/Animals/meowl.rsi
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.47
        density: 30
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Dead
  - type: DamageStateVisuals
    states:
      Alive:
        Base: meowl
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: MobPrice
    price: 100
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: ZombieImmune
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 100
      behaviors:
      - !type:GibBehavior
        recursive: false
