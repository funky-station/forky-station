#Devil Birds

- type: entity
  name: goose
  parent: MobGoose
  id: MobGooseGolden
  description: Its stomach and mind are an enigma beyond human comprehension.
  suffix: GOLD
  components:
  - type: ExaminableHunger
  - type: EggLayer
    eggSpawn:
    - id: WeirdEggGold

- type: entity
  name: goose
  parent: MobGoose
  id: MobGooseUranium
  description: Its stomach and mind are an enigma beyond human comprehension.
  suffix: URANIUM
  components:
  - type: ExaminableHunger
  - type: EggLayer
    eggSpawn:
    - id: WeirdEggUranium

- type: entity
  name: goose
  parent: MobGoose
  id: MobGoosePlasma
  description: Its stomach and mind are an enigma beyond human comprehension.
  suffix: PLASMA
  components:
  - type: ExaminableHunger
  - type: EggLayer
    eggSpawn:
    - id: WeirdEggPlasma

- type: entity
  name: servant of Nar'sie
  parent: MobGoose
  id: MobGooseNarsie
  description: A damned beast that yearns for blood.
  suffix: EVIL
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: goosenarsie
      sprite: _Funkystation/Mobs/Animals/goose.rsi
  - type: DamageStateVisuals
    states:
      Alive:
        Base: goosenarsie
      Critical:
        Base: dead
      Dead:
        Base: dead
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.01
  - type: CombatMode
  - type: MeleeWeapon
    altDisarm: false
    soundHit:
      path: /Audio/Weapons/punch3.ogg
    angle: 0
    animation: WeaponArcPunch
    damage:
      types:
        Blunt: 12
        Structural: 20
        Burn: 12
  - type: GhostTakeoverAvailable
  - type: GhostRole
    name: ghost-role-information-narsie-goose-name
    description: ghost-role-information-narsie-goose-description
    rules: ghost-role-information-narsie-goose-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: short
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
    blackboard:
      NavSmash: !type:Bool
        true
  - type: NpcFactionMember
    factions:
    - BloodCultist
    HostileFactions:
    - SimpleHostile

- type: entity
  parent: BaseStructure
  id: GooseRune_drawing
  name: "goose rune"
  components:
  - type: Sprite
    sprite: _Funkystation/Mobs/Animals/goose.rsi
    state: GooseNarsieSummon
  - type: TimedSpawner
    prototypes:
    - MobGooseNarsie
    intervalSeconds: 1.8
    minimumEntitiesSpawned: 1
  - type: TimedDespawn
    lifetime: 2
