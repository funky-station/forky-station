- type: entity
  parent: MechVim
  id: MechZleeb
  name: zoop zib zob
  description: A strange space faring ship. It looks only big enough for a small creature.
  components:
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: _Funkystation/Mobs/XenoArch/zleeb.rsi
    layers:
    - map: [ "enum.MechVisualLayers.Base" ]
      state: ship
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Mecha/mechmove03.ogg
      params:
        volume: -10
  - type: Mech
    baseState: ship
    openState: ship
    brokenState: ship
    maxEquipmentAmount: 1
  - type: MeleeWeapon
    hidden: true
    attackRate: 0.5
    damage:
      types:
        Blunt: 5 #Bonk
        bluntStaminaDamageFactor: 2.0
  - type: StaminaDamageOnHit
    damage: 35
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.6
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: NoSlip
