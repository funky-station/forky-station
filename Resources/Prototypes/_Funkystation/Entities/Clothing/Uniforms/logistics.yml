## jumpsuits

# cargo tech
- type: entity
  parent: ClothingUniformBase
  id: FuClothingUniformJumpsuitLogiCt
  name: cargo technician jumpsuit
  description: The standard jumpsuit for NanoTrasen cargo technicians. Copper brown, with beige accents. Comes with more pockets than the standard uniform.
  components:
