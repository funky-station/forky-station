# Engineering

- type: entity
  parent: ClothingBeltChiefEngineer
  id: FuClothingBeltChiefEngineerHarness
  name: chief engineer's harness
  description: Slightly scorched, frayed straps. It seems you STILL forgot your carabiners, though.
  components:
  - type: ItemMapper
    sprite: _Funkystation/Clothing/Belt/belt_overlay.rsi
  - type: Sprite
    sprite: _Funkystation/Clothing/Belt/ce_harness.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Belt/ce_harness.rsi
  - type: Storage
    maxItemSize: Normal

# This is currently unobtainable because giving the CE two belts is kind of a no no given that the functionality is supposed to belong to a unique command item.
# Once there's some sort of way to make sure that one and only one of the two spawns in a way that's accessible from the locker, this can be used.
- type: entity
  id: FuClothingBeltChiefEngineerHarnessFilled
  parent: FuClothingBeltChiefEngineerHarness
  suffix: Filled
  components:
  - type: StorageFill
    contents:
    - id: PowerDrill
    - id: JawsOfLife
    - id: WelderExperimental
    - id: Multitool
    - id: HolofanProjector
    - id: GasAnalyzer
    - id: ClothingHeadHatWeldingMaskFlameBlue

# Security

- type: entity
  parent: [ ClothingBeltStorageBase, BaseSecurityContraband ]
  id: FuClothingBeltSecurityWebbing
  name: security carrier
  description: A specialized webbing designed for security gear.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Belt/security_webbing.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Belt/security_webbing.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.9
  - type: Storage
    whitelist:
      tags:
      - CigPack
      - Taser
      - SecBeltEquip
      - Radio
      - Sidearm
      - MagazinePistol
      - MagazineMagnum
      - CombatKnife
      - Truncheon
      - HandGrenade
      components:
      - Stunbaton
      - FlashOnTrigger
      - SmokeOnTrigger
      - Flash
      - Handcuff
      - BallisticAmmoProvider
      - CartridgeAmmo
      - DoorRemote
      - Whistle
      - BalloonPopper

- type: entity
  parent: FuClothingBeltSecurityWebbing
  id: FuClothingBeltSecurityWebbingFilled
  name: security carrier
  suffix: Filled
  description: A specialized webbing designed for security gear.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: BeltSecurityEntityTable
