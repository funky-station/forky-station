- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: FuClothingOuterCoatLabCmo
  name: chief medical officer's lab coat
  description: A high quality medical-grade labcoat that protects against chemical spills. On the arms are anti-gas detection armbands, although newer coats no longer come with functional ones.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Coats/Labcoats/cmo.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Coats/Labcoats/cmo.rsi
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.95
        Heat: 0.90
        Caustic: 0.75

