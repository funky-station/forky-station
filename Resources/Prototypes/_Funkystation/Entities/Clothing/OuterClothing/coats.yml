# medical toggleable labcoats

- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: FuClothingOuterCoatLabMed
  name: medical lab coat
  description: A medical-grade labcoat that protects against minor chemical spills. On the arms are anti-gas detection armbands, although newer coats no longer come with functional ones.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Coats/Labcoats/med.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Coats/Labcoats/med.rsi
  - type: Armor
    modifiers:
      coefficients:
        Caustic: 0.85

