# security non-toggleable
- type: entity
  parent: [BaseSecurityCommandContraband, ClothingOuterArmorHoS, ClothingOuterStorageBase]
  id: FuClothingOuterWinterHos
  name: head of security's armored winter coat
  description: A sturdy, luxurious winter coat over a standard Type I armored vest to protect from hypothermic threats and otherwise.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Wintercoats/NoHood/hos.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Wintercoats/NoHood/hos.rsi
  - type: Storage
    grid:
    - 0,0,1,2
    - 3,0,4,2
    maxItemSize: Small

