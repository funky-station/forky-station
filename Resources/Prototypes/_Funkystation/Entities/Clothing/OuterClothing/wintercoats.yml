  name: medical insulated labcoat
  description: A medical-grade labcoat fitted with extra insulation. Still quite handy against caustic spills, while staying comfortably warm.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/OuterClothing/Wintercoats/Labcoats/med.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/OuterClothing/Wintercoats/Labcoats/med.rsi
