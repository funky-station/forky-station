# Deputy head badges

- type: entity
  parent: ClothingNeckBase
  id: FuClothingNeckBadgeDqm
  name: deputy quartermaster's badge
  suffix: dQM
  description: A badge that indicates that the wearer holds the position of Deputy Quartermaster.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Funkystation/Clothing/Neck/Misc/deputy_badges.rsi
    state: logdep
  - type: Clothing
    sprite: _Funkystation/Clothing/Neck/Misc/deputy_badges.rsi
    equippedPrefix: logdep

