#Prisoner Mining Suit
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitPrisonerMining
  name: prisoner mining hardsuit helmet
  description: A cheap, disposable helmet issued to prisoners on mining duty.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Hardsuits/spatiohelm.rsi
    layers:
    - state: icon
      map: [ "enum.ToggleableVisuals.Layer" ]
    - state: icon-unshaded
      shader: unshaded
      map: [ "unshaded_base" ]
    - state: light-overlay
      visible: false
      shader: unshaded
      map: [ "light" ]
    - state: icon-up
      visible: false
      map: [ "visor_icon" ]
  - type: HandheldLight
    addPrefix: false
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: equipped-head-light
        shader: unshaded
      head-vox:
      - state: equipped-head-light-vox
        shader: unshaded
      head-vulpkanin:
      - state: equipped-head-light-vulpkanin
        shader: unshaded
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-head
      - state: equipped-head-unshaded
        shader: unshaded
      head-vox:
      - state: equipped-head-vox
      - state: equipped-head-unshaded-vox
        shader: unshaded
      head-vulpkanin:
      - state: equipped-head-vulpkanin
      - state: equipped-head-unshaded-vulpkanin
        shader: unshaded
  - type: PointLight
    radius: 6
  - type: PressureProtection
    highPressureMultiplier: 0.72
    lowPressureMultiplier: 1000
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HelmetVisor
    isActive: true
    components:
    - type: EyeProtection
    - type: FlashImmunity
    - type: ESViewconeModifier
      angleModifier: -160
  - type: GenericVisualizer
    visuals:
      enum.HelmetVisorVisuals.IsDown:
        visor_icon:
          False: {visible: false}
          True: {visible: true, state: icon-up}
        unshaded_base:
          False: {visible: true}
          True: {visible: false}
