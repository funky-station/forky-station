# medical faceshield

- type: entity
  parent: ClothingHeadBase
  id: FuClothingHeadFaceshield
  name: face shield
  description: A medical face shield meant to further impede infection vectors.
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Misc/faceshield.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Misc/faceshield.rsi
  - type: IngestionBlocker

# For taking pictures of things for PRs, chameleon so it can blend in.
- type: entity
  parent: [ClothingHeadBase, BaseChameleon]
  id: FunkyClothingHeadHat360
  name: 360 degree hat
  suffix: DEBUG
  description: This chameleon hat lets you see 360 degrees around you.
  components:
  - type: ESViewconeModifier
    angleModifier: 360
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Misc/mirrorhelm.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Misc/mirrorhelm.rsi
  - type: ChameleonClothing
    slot: [ HEAD ]
    default: FunkyClothingHeadMirrorHelm
  - type: Tag
    tags:
    - PetWearable
    - CorgiWearable
    - ClothMade
    - HamsterWearable

# here as the default sprite for the 360 hat
- type: entity
  parent: ClothingHeadBase
  id: FunkyClothingHeadMirrorHelm
  name: mirror helm
  description: A hat made of mirrors
  components:
  - type: Sprite
    sprite: _Funkystation/Clothing/Head/Misc/mirrorhelm.rsi
  - type: Clothing
    sprite: _Funkystation/Clothing/Head/Misc/mirrorhelm.rsi
