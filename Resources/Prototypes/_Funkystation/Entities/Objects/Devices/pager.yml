- type: entity
  parent: BaseItem
  id: BasePager
  abstract: true
  components:
  - type: Pager
    blacklist:
    - "8008135"
    - "67"
    - "6767"
    - "676767"
    - "67676767"
    - "shitmin"
    - "wingstop"
    - "8264015"
    - "3284"
    - "fuckcc"
    - "fucknt"
    - "unionize"
    - "unionise"
    - "union"
  - type: Ringer
    popup: pager-page-received
  - type: UserInterface
    interfaces:
      enum.PagerUiKey.Key:
        type: PagerBoundUserInterface
      enum.RingerUiKey.Key:
        type: RingerBoundUserInterface
  - type: ActivatableUI
    key: enum.PagerUiKey.Key
  - type: DeviceLinkSource
    ports:
    - PagerSender

- type: entity
  parent: BasePager
  id: PagerGray
  suffix: Gray
  name: PB-10 pager
  description: A small, gray handheld pager, ever ubiquitous "Pocket Bell" brand. About as generic as it gets.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Devices/Pagers/gray.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Item
    size: Tiny
    sprite: _Funkystation/Objects/Devices/Pagers/gray.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unshaded
        shader: unshaded

