- type: entity
  name: listening-bug-name
  description: listening-bug-description
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: RadioListeningBugSyndicate
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: SyndicateListening
    listenRange: 6
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Transform
    anchored: false
  - type: Tag
    tags:
    - Radio
    - ListeningBug

- type: entity
  parent: [ RadioListeningBugSyndicate, BaseSecurityContraband ]
  id: RadioListeningBugDetective
  components:
  - type: RadioMicrophone
    broadcastChannel: Detective
    listenRange: 6
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    sprite: Objects/Devices/communication.rsi
    heldPrefix: walkietalkie

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyDetective
  name: listening bug encryption key
  description: An encryption key used to tune into the detectives listening bugs.
  components:
  - type: EncryptionKey
    channels:
    - Detective
    defaultChannel: Detective
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: sec_label
