# CARGO
- type: entity
  parent: PersonalAI
  id: MentorPAILogistics
  name: personal logistics mentor ai
  description: It's a personal AI trained on petabytes of botanical lectures, market manipulation tactics, and videos of logistic workers doing their job.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Devices/MentorpAIs/cargo.rsi
    layers:
    - state: icon
    - state: off-overlay
      shader: unshaded
      map: ["screen"]
  - type: ToggleableGhostRole
    roleName: logi-mentor-pai-role-name
    roleDescription: logi-mentor-pai-role-description
  - type: ActiveRadio
    channels:
    - Common
    - Cargo #double check the encryption channels later
  - type: GenericVisualizer
    visuals:
      enum.ToggleableGhostRoleVisuals.Status:
        screen:
          Off: { state: off-overlay }
          Searching: { state: searching-overlay }
          On: { state: on-overlay }
  - type: Item
    inhandVisuals:
      left:
      - state: cargo-inhand-left
      right:
      - state: cargo-inhand-right

