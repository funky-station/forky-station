# Handheld radio actions

- type: entity
  id: ActionToggleRadioSpeaker
  parent: BaseAction
  name: Toggle radio on/off
  description: Turns the radio and its speaker on and off.
  components:
  - type: Action
    useDelay: 1 # can be overridden by radio component
  - type: Sprite
    sprite: /Textures/Clothing/Ears/Headsets/base.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:ToggleRadioSpeakerEvent

- type: entity
  id: ActionToggleRadioMicrophone
  parent: BaseAction
  name: Toggle mic on/off
  description: Turns the radio's microphone on and off.
  components:
  - type: Action
    useDelay: 1 # can be overridden by radio component
  - type: Sprite
    sprite: /Textures/Interface/Actions/voice-mask.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:ToggleRadioMicrophoneEvent

# Departmental handheld radios

- type: entity
  name: service handheld radio
  description: A handheld radio tuned to the service radio frequency.
  parent: RadioHandheld
  id: RadioHandheldService
  components:
  - type: RadioMicrophone
    broadcastChannel: Service
  - type: RadioSpeaker
    channels:
    - Service
  - type: Sprite
    sprite: _Funkystation/Objects/Devices/radio.rsi
    layers:
    - state: base
    - state: cap-service
    - state: active
      visible: false
      shader: unshaded
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    sprite: Objects/Devices/securityhandy.rsi
    heldPrefix: walkietalkie

