# Funky atmos - /tg/ gases
- type: entity
  id: ElectrolyzerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: electrolyzer machine board
  description: A machine printed circuit board for an electrolyzer.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: Electrolyzer
    stackRequirements:
      Steel: 5
      Manipulator: 2
      CableHV: 5

- type: entity
  id: CargoTechFabCircuitboard
  parent: BaseMachineCircuitboard
  name: cargo techfab machine board
  description: A machine printed circuit board for a cargo techfab.
  components:
  - type: Sprite
    state: cpu_supply
  - type: MachineBoard
    prototype: CargoTechFab
    stackRequirements:
      Manipulator: 4
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker

