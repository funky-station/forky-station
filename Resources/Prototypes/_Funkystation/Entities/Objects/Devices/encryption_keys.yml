- type: entity
  parent: EncryptionKey
  id: EncryptionKeyEmergency
  name: emergency encryption key
  description: An encryption key used by paramedics, brigmedics, and security dispatchers.
  components:
  - type: EncryptionKey
    channels:
    - Emergency
    defaultChannel: Emergency
  - type: Sprite
    layers:
    - state: crypt_gray # upstream name
    - state: label-emergency
    
- type: entity
  parent: EncryptionKeyCommon
  id: EncryptionKeyIA
  name: IA encryption key
  description: An encryption key used by internal affairs employees.
  components:
  - type: EncryptionKey
    channels:
    - InternalAffairs
    defaultChannel: InternalAffairs
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label