- type: entity
  parent: EncryptionKeyCommon
  id: EncryptionKeyIA
  name: IA encryption key
  description: An encryption key used by internal affairs employees.
  components:
  - type: EncryptionKey
    channels:
    - InternalAffairs
    defaultChannel: InternalAffairs
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyHailing
  name: hailing encryption key
  description: An encryption key used for hailing passing ships.
  components:
  - type: EncryptionKey
    channels:
    - Hailing
    defaultChannel: Hailing
  - type: Sprite
    layers:
    - state: crypt_silver
    - state: com_label
