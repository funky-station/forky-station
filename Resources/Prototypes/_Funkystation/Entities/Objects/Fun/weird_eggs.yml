- type: entity
  parent: BaseItem
  id: WeirdEggBase
  description: An strange egg!
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/egg.rsi
  - type: Item
    sprite: Objects/Consumable/Food/egg.rsi
    size: Tiny
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Effects/metal_slam4.ogg
      params:
        volume: 0
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/metal_slam4.ogg
      params:
        volume: -2
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 5
  - type: Tag
    tags:
    - Egg

- type: entity
  parent: WeirdEggBase
  id: WeirdEggGold
  name: golden egg
  description: An golden egg!
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Fun/weirdeggs.rsi
    state: golden
  - type: Item
    sprite: _Funkystation/Objects/Fun/weirdeggs.rsi
    state: golden
    size: Tiny
  - type: PhysicalComposition
    materialComposition:
      Gold: 100

