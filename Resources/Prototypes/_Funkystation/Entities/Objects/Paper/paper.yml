
# more desaturated colurs below

- type: entity
  name: orange Paper
  parent: Paper
  id: PaperOrange
  description: 'A piece of orange paper.'
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#FFB162"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#FFB162"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: Invoice
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: FaxableObject
  - type: PaperVisuals
    backgroundModulate: "#FFB162"
    contentImageModulate: "#FFB162"

- type: entity
  name: orange office paper
  parent: Paper
  id: OfficePaperOrange
  description: 'A single unit of orange bureaucracy.'
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#FFB162"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#FFB162"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: Invoice
  - type: Tag
    tags:
    - Document
    - Trash
    - Paper
  - type: FaxableObject
  - type: PaperVisuals
    backgroundModulate: "#FFB162"
    contentImageModulate: "#FFB162"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0


