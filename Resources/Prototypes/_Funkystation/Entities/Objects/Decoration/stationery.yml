# Pen receptacle

## Abstract prototype

- type: entity
  id: BasePenReceptacle
  abstract: true
  parent: BaseItem
  name: pen receptacle
  description: A plastic container distributed by NanoTrasen in a futile attempt to limit loss of stationery.
  components:
  - type: Item
    size: Small
  - type: PhysicalComposition
    materialComposition:
      Plastic: 10
  - type: ItemSlots
    slots:
      pen_slot8:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 8
      pen_slot7:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 7
      pen_slot6:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 6
      pen_slot5:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 5
      pen_slot4:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 4
      pen_slot3:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 3
      pen_slot2:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 2
      pen_slot1:
        name: pen-receptacle-slot-component-slot-name-pen
        insertSound: /Audio/_Funkystation/Items/pen_drop.ogg
        ejectSound: null
        whitelist:
          tags:
          - Write
        priority: 1
  - type: ContainerContainer
    containers:
      pen_slot8: !type:ContainerSlot { }
      pen_slot7: !type:ContainerSlot { }
      pen_slot6: !type:ContainerSlot { }
      pen_slot5: !type:ContainerSlot { }
      pen_slot4: !type:ContainerSlot { }
      pen_slot3: !type:ContainerSlot { }
      pen_slot2: !type:ContainerSlot { }
      pen_slot1: !type:ContainerSlot { }
  - type: ItemMapper
    mapLayers:
      pen1:
        minCount: 1
        whitelist:
          tags:
          - Write
      pen2:
        minCount: 2
        whitelist:
          tags:
          - Write
      pen3:
        minCount: 3
        whitelist:
          tags:
          - Write
      pen4:
        minCount: 4
        whitelist:
          tags:
          - Write
    sprite: _Funkystation/Objects/Decoration/pen_receptacle.rsi
  - type: Appearance

