#Submitted by Stabithar
- type: entity
  parent: BookBase
  id: ZeroSumSymphonyVol1
  name: "The Zero-Sum Symphony Book One: Phantom Breach"
  description: A military thriller about an assault on a NanoTrasen station by a Syndicate Nuclear Operative.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#000000"
    - state: decor_bottom
      color: "#700000"
    - state: icon_chemical
      color: "#00ff1b"
    - state: icon_eye
      color: "#00ff1b"
    - state: icon_skull
      color: "#ff0000"
    - state: icon_text3
      color: "#d5dc1d"
    - state: detail_bookmark
      color: "#38952a"
  - type: OocAuthorship
    oocAuthor: Stabithar
  - type: Paper
    stampedBy:
    - stampedColor: '#134975'
      stampedName: stamped-nt-approved
    content: book-text-zerosumsymphony-1

