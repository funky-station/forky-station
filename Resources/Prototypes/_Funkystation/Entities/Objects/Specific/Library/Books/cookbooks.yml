- type: entity
  parent: BookBase
  id: BookCookbookPie
  name: Granny Pecan's guide to pies
  description: An older book full of pie recipies.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#e88a36"
    - state: decor_bottom
      color: "#b05b2c"
    - state: decor_wingette
      color: "#f8c53a"
    - state: icon_apple
    - state: icon_text2
      color: "#b12023"
    - state: detail_bookmark
      color: "#2c5491"
  - type: OocAuthorship
    oocAuthor: mkanke
  - type: Paper
    stampedBy:
    - stampedColor: '#134975'
      stampedName: stamped-nt-approved
    content: book-text-cookbook-pie
