      [head=2]Moon Station H.J.N.K: Rules and Pranks[/head]
      A game by Vafod Brettleblox

      [bold]Welcome to Moon Station H.J.ö.N.K. Enjoy your shift.[/bold]

      [italic]In the far future Humanity has stretched across the galaxy and found absolutely nothing. After that things got really weird really fast. Weird Drives, Pet Uplifts, NLC (Near Light Cloning) travel, Space Clowns.[/italic]

      Today is your first shift at the best post in the entirety of the LSC. Luna 1 and your cloned body is already aching.

      [bold]Set Up[/bold]

      It is suggested that you create your own cards for a smoother experience.
      There will be more detailed instructions in a future version.

      Separate the cards into five decks, each suit (Clubs, Spades, Diamonds, Hearts) and the face cards(Kings, Queens, Jacks.).
      Add the face cards into the Clubs deck. Shuffle all decks individually and place them next to each other making sure to mark which deck is which. Keep this booklet open and use the tables in the Cards section.


      [bold]Optional Set Up Rules[/bold]

      Players must create their own crewmember using their own artistic or writing ability.
      If used, refer to the Alternate Win Rules.

      Add the joker cards into the Clubs deck

      [bold]Play[/bold]

      The objective of the game is to collect points and have the most interesting shifts as possible. To do that each card has a point value and flavour text that acts as a window into how your shift went.

      [bold]Turn Order[/bold]

      Starting with the person who last ate a banana, then going clockwise, each player takes a turn.

      Choose two decks and draw one card from each of them. If you have more than 6 cards in your hand, place two cards from your hand on the bottom of their respective decks before you draw.

      Play one of the cards from your hand on any player.

      Continue taking turns until one character reaches 10 points.

      [bold]Deck Aesthetics and Special Rules.[/bold]

      Each deck has character and aesthetic that embodies what cards you can get from them.
      When choosing a deck to draw from, keep these in mind.

      [color=#2A81CC][bold](Clubs)Head of Personnel, Scruffles[/bold][/color]
      Reliable and safe, Scruffle likes to keep his deck on even keel. If you draw from his deck you will always get something positive though, it won’t be the most exciting shift. It’s also the only place you can draw powerful Gear Cards which can manipulate other cards.


      [color=#6A2894][bold](Spades) Janitor Goobie[/bold][/color]
      Goobie is a klutz, likes to drink too much tea, and keeps the station spotless. Her deck is much the same hot mess she is. The cards can be used to increase your points or decrease others.

      [color=#C73232][bold](Diamonds)Shadowfoot the Proud[/bold][/color]
      Like any cat Shadowfoot is a tiny, cute little monster who would murder for the right scritches. She is the blade in the night and the antagonist of the station. Drawing from her deck you take on the antagonist roll and take an axe to the station. Her deck is full of cards that affect every player, increasing or decreasing en-mass.

      [color=#EC9898][bold](Hearts)Yes the Clown[/bold][/color]
      “Whaaat do YoU cAlL a COW WITh no LEGS? A sad coW!?” The clown’s deck is high risk, high reward. Anything you draw from this deck is played on your
      character when drawn. There are some really high value cards in this deck, there are also some absolutely terrible cards as well.

      Card compass (X represents the point value.)
      +X Add that many points
      -X Subtract that many points

      Antagonist cards
      These cards are played in the middle and only the last card played counts.
      XP The player who plays this card adds/subtracts that many points
      XO All players except the player who plays the card adds/subtracts that many points

      High risk Cards
      XH This card must be immediately played on the player who drew it.

      Gear Cards
      G This card may be played at any time on any card/player.

      [bold]Winning.[/bold]

      When someone reaches +10 or -10 points the game is over and point values are totaled.

      The following gives a player one WP(Win Point):
      The most points
      The most interesting shift by player consensus
      The lowest points

      [bold]Alternate Win Rules[/bold]

      Everyone who made their character gets a win point

      The person with the most WP wins the game.

