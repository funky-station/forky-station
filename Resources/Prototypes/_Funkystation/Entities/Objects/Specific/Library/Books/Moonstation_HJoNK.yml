      [color=#6A2894][bold]8.[/bold][/color] +2
      	[italic]Married your long time girlfriend, the one and only sapient chicken, Cluclacon.[/italic]

      [color=#6A2894][bold]7.[/bold][/color] +1
      	[italic]The station AI remembers your birthday and opens doors for you all day.[/italic]

      [color=#6A2894][bold]6.[/bold][/color] +1
      	[italic]It turns out Elvis was a time traveler and he’s LIVE IN THE MESS HALL!?![/italic]

      [color=#6A2894][bold]5.[/bold][/color] +1
      	[italic]You find a space hamster in the vents and adopt it.[/italic]

      [color=#6A2894][bold]4. v-1[/bold][/color]
      	[italic]Space clown. Banana peel. Thumbtack.[/italic]

      [color=#6A2894][bold]3.[/bold][/color] -1
      	[italic]Accidentally set off a sanitization grenade on your samples. Two years of work are gone.[/italic]

      [color=#6A2894][bold]2.[/bold][/color] -2
      	[italic]Contracted a space virus which switched your hair and your rear. Everyone calls you Doctor Butt Head.[/italic]

      [color=#6A2894][bold]A.[/bold][/color] -3
      	[italic]Forgot your diaper during EVA but didn’t realise until too late.[/italic]


      [color=#C73232][bold]Diamonds[/bold][/color]


      [color=#C73232][bold]10.[/bold][/color] +2P -3O
      	[italic]Through paperwork you take control of the station. You execute the captain by mortal combat with a small crab.[/italic]

      [color=#C73232][bold]9.[/bold][/color] +1P -2O
      	[italic]You bypass the reactor transformer and hook the output directly to the station main. The hum of a station electric is stunning.[/italic]

      [color=#C73232][bold]8.[/bold][/color] +1P +1O
      	[italic]Safe shift, no problems. The captain throws a pizza party.[/italic]

      [color=#C73232][bold]7.[/bold][/color] -3O
      	[italic]The AI overpressurized the station and blew out all the windows. The cloners are in a vacuum.[/italic]

      [color=#C73232][bold]6.[/bold][/color] -2O
      	[italic]Someone let loose a Singulo and it bounces around the station, killing as it goes.[/italic]

      [color=#C73232][bold]5.[/bold][/color] -1O
      	[italic]An alien artefact turns everyone into sentient ham sandwiches.[/italic]

      [color=#C73232][bold]4.[/bold][/color] -1O
      	[italic]The captain introduces mind control chips and the station has never run smoother.[/italic]

      [color=#C73232][bold]3.[/bold][/color] -1P
      	[italic]You try to steal the captain’s hat and the clown catches you. Now you’re in the banana contraption.[/italic]

      [color=#C73232][bold]2. [/bold][/color]-1P -1O
      	[italic]You thought you made napalm but instead you made industrial space lubricant. Now the only thing on fire is everyone’s sick skating moves.[/italic]

      [color=#C73232][bold]A. -2P -2O[/bold][/color]
      	[italic]SPACE BEES!!!!!!!!!![/italic]

      [color=#EC9898][bold]Hearts[/bold][/color]


      [color=#EC9898][bold]10.[/bold][/color] +5H
      	[italic]With the clown by your side you killed a cosmic being. Not only did you kill a god but loneliness as well.[/italic]

      [color=#EC9898][bold]9.[/bold][/color] +3H
      	[italic]Harnessing the very essence of the underworld you create the mythical Hellburn inside the reactor and get a medal.[/italic]

      [color=#EC9898][bold]8.[/bold][/color] +3H
      	[italic]Spork the Corgi spins for you. Twice![/italic]

      [color=#EC9898][bold]7.[/bold][/color] +2H
      [italic]The space gods have given you a cookie.[/italic]

      [color=#EC9898][bold]6.[/bold][/color] +2H
      	[italic]Through the powers of science you get trapped in an infinite loop of time. You use this time to catch up with all the paperwork you’re ever going to have.[/italic]

      [color=#EC9898][bold]5.[/bold][/color] +2H
      	[italic]A space truck full of novelty beds crashes through the station. You sleep in a different race car bed every night.[/italic]

      [color=#EC9898][bold]4.[/bold][/color] -2H
      	[italic]A gorilla stole your favourite mop and you spent the entire shift trying to get it back.[/italic]

      [color=#EC9898][bold]3.[/bold][/color] -3H
      	[italic]Forgot to upload memories for six weeks, eaten by a giant space spider, have an existential crisis.[/italic]

      [color=#EC9898][bold]2. [/bold][/color]-3H
      	[italic]Shady people with squeaky shoes swap the clown and your brain. No one believes you.[/italic]

      [color=#EC9898][bold]A. [/bold][/color]-5H
      	[italic]You ate the cosmic doughnut. The singulos taste like stardust.[/italic]

