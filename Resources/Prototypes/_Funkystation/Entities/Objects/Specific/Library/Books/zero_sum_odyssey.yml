#Submitted by Stabithar
- type: entity
  parent: BookBase
  id: ZeroSumOdysseyVol1
  name: "The Zero-Sum Odyssey Book One: Anodyne Trepidation"
  description: A slice-of-life prelude to an action-adventure thriller.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#808080"
    - state: decor_vertical_middle
      color: "#6f2d80"
    - state: decor_bottom
      color: "#3a3a3a"
    - state: icon_apple
      color: "#ff0000"
    - state: icon_biohazard
      color: "#990033"
    - state: icon_bucket
    - state: icon_text3
      color: "#d5dc1d"
    - state: decor_spine
      color: "#540f09"
  - type: OocAuthorship
    oocAuthor: Stabithar
  - type: Paper
    stampedBy:
    - stampedColor: '#134975'
      stampedName: stamped-nt-approved
    content: book-text-zerosumodyssey-1

