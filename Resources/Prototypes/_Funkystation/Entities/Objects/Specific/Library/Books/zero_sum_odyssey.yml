      [head=2]The Zero-Sum Odyssey [/head]
      [head=3]Book Two: Crimson Redemption[/head]
      A book by Genevieve Blaine

      ================================================
      The following is a work of fiction. Any resemblance to any events or persons, living or dead, is entirely coincidental
      ================================================

      It didn’t take long for Riichinomi to get Chunk Bulkslab equipped for the rescue. The Quartermaster left him to get into the spare hardsuit while they added Salvage to Chunk’s ID, but he didn’t need the extra time. “It’s so roomy!” He said out loud to the docking bay, “Way more comfy than anything I wore in Gorilla-X.”

      A raucous laugh echoed through the Cargo department. “Glad to hear it - but I’d keep that name under wraps. Don’t want to make anyone nervous.” The Quartermaster tossed Chunk’s modified ID towards him, where it bounced between his hands until he slotted it into his PDA.
      “Uh, sir! Of course, sir.” He saluted, still holding his PDA. “Ow!”
      “I don’t need the formality, Chunk. Oh, you’ll need this, too.” croaked the vox, before tapping a button on the Salvage vendor and offering the salvager-nee-janitor the item.
      “What is it?” asked Chunk, turning over the cylinder - ridged along the sides, with a trigger-bearing handle on one end.
      “Proto-Kinetic Accelerator”, replied Riichinomi, “It’s sort of a space gun.”
      “Aw hell,” lamented Chunk, “I’m too overloaded to carry ammo!”
      “Doesn’t need any. Recharges automatically.”
      “Whoa. That’s so fucking future.”

      “The console makes piloting the shuttle fairly simple,” explained Riichinomi over the radio after Chunk had boarded the cargo shuttle, “Think of it like walking, except with momentum and a bigger turning circle”
      Chunk tapped some buttons on the console. “It’s not working?”
      A cough came through the radio. “You, uh, need to undock from the station first - see the buttons in the interface?” A hissing noise came from the cargo bay airlocks. “Yeah, that. Head towards the ‘mining’ marker, it’s the salvage shuttle’s IFF designation”
      “It looks like they’re next to a huge…lumpy thing?”
      “That’s the VGRoid - they’ll have been mining the ironrock there. That’s good; it means they  haven’t gotten lost in space. Probably.” Riichinomi sounded relieved.

      Chunk hunched over the console, staring at the mass scanner readout. At first, he was delicately pecking at the keys, the thrusters firing in brief bursts, but he quickly grew in confidence after finding it really was as easy as the Quartermaster had said.
      The radio crackled to life again. “Okay, now here’s the tricky part. Try to dock with their shuttle, but remember that if you bump up against it before docking, it’ll cause problems. In space, there’s momentum but no friction - the inertial brake is going to be your best friend.”
      Chunk froze - he wasn’t ready for such a test of his skills - but slowly, carefully nudged the two shuttles together until with a whirr-[italic]clunk[/italic] he was rewarded by the sound of successful docking.
      “Fine work, Bulkslab!”
      “Wait, sir, how did you know I managed it?”
      “I told you, I’m not a ‘sir’. Anyway-”
      “Umm… ma’am then?” Chunk interrupted.
      The irony of interrupting someone in his rush to be polite was not lost on Riichinomi. They cackled.
      “No titles, please. Anyway, I’ve got a shuttle console here. I was watching the whole time.”
      “Wait - if you had access to a console from the start, how come I was the one driving?”
      Chunk could hear the sly grin in the Quartermaster’s voice: “Maybe I was sure you could handle it if you put your mind to it, and if it ever got out of your hands, you’d still have a safety net - which, I might add, you never had cause to notice.”
      “Si- I mean, ma-, I mean-” Chunk choked on his words. “Thank you.”
      “I’ll take the cargo shuttle back once you’re safely on board ‘mining’. Good luck!”
      Chunk retracted his helmet briefly to wipe a tear from his eye, and stepped onto the salvage shuttle.

      His magboot landed with a squelch. Chunk looked down. The entire floor was covered in blood. Chunk yelped as he ran to and fro, but saw no salvager remains. What he did see was a selection of carp meat and offal. “Oh, right, they cut up the space-fish… and didn’t clean up afterwards.” Chunk muttered to himself as his eyes narrowed.
      “Oh well, good thing I’m the one coming to the rescue!” Chunk’s attitude reversed as he primed a cleanade from his belt. As the space-cleaner foamed throughout the ship, he saw a pAI device on the dashboard.
      “A pAI! And they left it behind…?”
      The pAI blinked to life. “Observation: pAIs often take time to boot up. It is not out of the ordinary to leave an inert device behind.”
      “Well, you’re un-inert now, so-OOF” Chunk slipped on the puddle the cleaner had produced in his hurry to reach the pAI.
      “Advisory: Magboots’ stability-enhancing properties are non-functional unless activated.”
      Chunk rubbed the back of his head. At least he wasn’t actually hurt. “Thanks… hey, do you think you could be a bit more, um, friendly?”
      The pAI beeped. “Understood. Running sociability.aie. Initiating updog protocol.”
      “Updog?” Chunk’s brow furrowed. “What’s ‘updog’?”
      “Not much, what’s up with you?!!” The pAI sounded a trilling tone that could only have been its version of laughter.
      Chunk joined in. “Oh, man, we’re going to get along great. But wait - this isn’t joking time, it’s rescue time!”
      He took a deep breath, gritted his teeth, and stepped from the shuttle’s loading bay onto the pale gravel of the VGRoid.

      Chunk hadn’t taken more than five steps before he could feel his breathing growing ragged. “Whoa, these magboots must be heavier than I thought…”
      “Are you sure you brought oxygen with you?” queried the pAI
      Chunk pouted. “You forget the tank one time and nobody lets you forget it around here, huh. Yes, I’ve got a full oh-two in the hardsuit.”
      “And you remembered to activate your internal breathing apparatus?”
      Chunk stopped in place, and quietly raised a finger to a switch near the suit’s neck joint. It clicked into position and his suit filled with a gaseous hiss.
      Despite how much more breathable his internal air was, Chunk coughed. His pAI remained resolutely silent until they started walking again.
      “You should probably be packin’ your PKA,” advised the device, “We don’t know what’s around the corners.”
      Chunk quietly retrieved his weapon and touched the red rocks surrounding them. He swore he could feel a low rumble. “Do you think that’s what got the salvagers?”
      The pAI buzzed. “We won’t know until we find them.”

      They spent a while carefully making their way through the excavated tunnels that wound around chasing veins of ore like a snake from an old PDA game. But despite their caution, they were shocked when they peeked around a corner.
      “What the FUCK is that?!” shouted Chunk, reflexively blasting a round from his PKA.
      It was a mass of eyes and chitin, all burning a deep red that seemed to hate all intelligent life.
      “That’s a goliath. We need to retreat and regroup.”
      “More like retreat and re-go-somewhere-else!”
      “We can’t do that. I saw a blue smear on the ground - that matches Augustus Atracidae’s blood.”
      Chunk swore.
      “Luckily, I have a plan,” the pAI continued, “You need to advance, fire, and retreat before it has a chance to use its tentacle attack.”
      “Tentacle attack?! This keeps getting better…” But Chunk knew he didn’t have a choice - the salvagers were in a much worse situation. He followed the plan.
      The first shot went wide, too wide. “This thing’s a piece of junk! It doesn’t even shoot where I point!” complained Chunk.
      “Try holding it with both hands!” urged the pAI.
      Chunk raised an eyebrow, but raised his left hand up to steady the device as he ran in for his next shot.
      “Whoa, that’s so much better! And I’ve got time to line up every single shot; I don’t just hafta spray on full-auto!”
      A beep came from the pAI - it agreed.

      The plan worked, up to a point. But despite the improved accuracy, the two moving bodies meant that few of the bolts met their mark.
      “Shit, this is taking forever. I need to get in closer. The tentacles can’t be that bad” Chunk started his advance.
      “I really don’t think you should do that,” cautioned the pAI, “They’ll trip you; you’ll be a sitting duck for its deadly slam attack.”
      “Oh, is that all?” Chunk quipped, rushing towards the monster, “I’ve got my magboots! I don’t need to worr-URGH”
      Chunk’s helmet slammed into the dirt. “They’ll only stop you from slipping! They can’t help you if you’re physically pulled to the ground!” explained the pAI, as the goliath advanced.
      Just as the pAI had said, Chunk could only watch in horror as the monster’s huge bulk collided, slammed, crashed into his body.

      He managed to scramble to his feet and run past it, toward the relative safety of a half-built fence.
      “Sh-shit-t, that’s MY blood,” he gasped, seeing the steadily-growing pool at his feet. He rummaged in his backpack for his emergency med-pen and jabbed it into a port on his hardsuit designed for that purpose.
      Though Chunk’s head was swimming, the adrenaline and epinephrine made him fixate on a tiny detail. “Hey wait, where did my blood come from? Aren’t these supposed to be airtight?”
      “Imagine if they weren’t,” explained his pAI, “have you ever worn wet socks? Imagine that all over. There’s a double-osmosis membrane incorporated.”

      The calm, melodic voice brought Chunk back to the present. “Right. Okay. Now, it’s personal.”
      He reflexively moved his hand to cock the PKA (though it didn’t need it), only to find his hands empty. It had been knocked to the floor with him back past the goliath.
      “Shit.”

      ◄●●●►

