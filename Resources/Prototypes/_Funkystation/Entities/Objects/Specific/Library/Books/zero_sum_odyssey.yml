      [head=2]The Zero-Sum Odyssey[/head]
      [head=3]Book One: Anodyne Trepidation[/head]
      A book by Genevieve Blaine

      ================================================
      The following is a work of fiction. Any resemblance to any events or persons, living or dead, is entirely coincidental
      ================================================

      [italic]The newest entry in the bestselling Zero-Sum series! Meet the new and returning members of Cpt. Nichael Trace’s crew![/italic]

      "...ani to front, please! Jani to front!"
      Chunk Bulkslab, who had left the Gorilla-X Wreckers some time ago and was now a NanoTrasen janitor, started at the noise outside his janitor's station. He shook his head awake. [italic]Ugh, Sudden Sleep Disorder,[/italic] he thought, [italic]I hope NT finds a cure soon…[/italic]

      Opening his door, he was greeted by the smiling face of Edison Opto, in his striking blue uniform. "Mail for you, Chunk!" he beamed, his outstretched hand holding a brown envelope bearing a green stamp. "Oh, uh, thanks," muttered Chunk blearily, "what could this be...?"
      But as soon as the envelope had left his hand, Edison had saluted and jogged away, mailbag bouncing along with him. "Aww! NanoTraffen fwent me fome cookief!" Chunk exclaimed through the choc-chip in his mouth, spitting crumbs on the floor.

      He swallowed and stood for a moment, before noticing the empty envelope for - apparently - the first time. "Oh shit! I got a job to do!"

      In a whirl of activity he loaded up his janitorial trolley and stuffed the envelope into the trash bag. "Look out grime, it's cleaning time!" he boasted, posing dramatically.
      He paused for a moment, and his shoulders fell slightly. "Hmm. Needs work." he mused.

      Chunk barrelled through the hallway, sweeping up food wrappers and mopping up stains, until he skidded to a stop in front of the thaven Head of Personnel. Devotion smiled at him. "Mr. Bulkslab! Great to see you working with such gusto." Chunk returned his greeting with a somewhat lopsided salute, "Thank you, sir! I'm keen to clean!" He nodded to himself and rubbed his chin. [italic]Much better,[/italic] he thought.

      But something that had been bothering him for a while wormed its way back into his self-satisfied glow: "Sir, how come the station's so messy?"
      Devotion raised an eyebrow, "Are you not up to the task of cleaning it?" he asked.
      "No, no, I just mean..." he stammered, "This is an NT station, right? So why is there all this trash and mess all over the place? I woulda thought they'd be more proud of their workplace."
      Devotion cast his eyes upward in thought. "There may be any number of reasons. Currently, I believe it is due to the recent shift change - after all, accidents happen when people are in a hurry."
      Chunk nodded slowly. This made sense. After all, he'd just dropped his envelope on the floor with the cookie crumbs, and that was before he was hurrying. He saluted - vigorously this time - and charged off in search of more messes.

      He wouldn't have far to look. He heard a noise like "Wom" before he saw the slowly-expanding puddle on the floor, even before he noticed its source - a green floating..orb? It wasn't quite spherical enough for him to feel confident calling it an orb.
      The scientist (a grey-furred vulpkanin named Selena Garo) manning the A.P.E. nearby noticed him approaching, mop raised, and quickly flagged him down before he got too close.
      "Be careful!!" she yelled, "There could be all kinds of chemicals in here. Don't risk taking the mop to them!"
      Chunk froze. He had no idea how to handle a puddle that couldn't be mopped. He started rummaging through his janitorial belt, but was interrupted again by the scientist.
      "Wait.. there could be [italic]all kinds[/italic] of chemicals in there. Don't just drop a cleanade - we could probably use them! Go get a syringe from medical and slurp 'em up."
      "Is that safe?" Chunk doubted.
      "Safer than trying to mop it!" reassured Selena, tapping her forehead.
      Chunk shrugged. This was, after all, outside his area of expertise. He started moseying towards the medical bay.

      After explaining Selena's idea, there was little resistance from the chemist on duty. They even gave him an extra beaker - "in case you see a white puddle that looks soothing - that’s probably omnizine!" - but it wasn't going to be that easy.

      A squelching noise caught Chunk's attention. He looked down and squinted - the yellow of his galoshes mixed with the yellow of the banana peel.
      "Whoa, that could have been dangerous! The non-slip tech in my galoshes sure is something else." Chunk thought out loud, "Good thing I got here first!" he shoved the peel into his steadily-growing trash bag.
      "Ekscussse me!!" came a shout from around the corner, "That wasss of critical importance for my act!"
      It was Eats-Fruits-and-Leaves, the station's clown, her lurid blue skin still partially visible beneath her mask.
      "Oh shit! Sorry, Fruity, I'll grab it back for you", Chunk apologised, handing over the peel from inside the trash bag.
      "Retrieved? From inssside your garbage sssack?! Whereupon it wasss befoul'd? Besssmirched by the detritusss of the ssstation? No! That sssimply will not do - I need a fresssh one now."
      She tossed the 'dirty' peel over her shoulder and began to storm off.

      Chunk was crestfallen. "I was only trying--"
      He was interrupted yet again, as Eats-Fruits' oversized shoes caught the peel and sent her flying. As laughter echoed around him, he realised that this was the clown's plan all along, and his horror turned to glee.
      "Oh man, you super got me." he chuckled. He started to applaud, but the rustling of the trash bag in his hand reminded him he still had a job left to do.
      "Duty calls, Fruits, and she’s not going to leave a voicemail."
      “Oh, really?” quipped Eats-Fruits, “What’sss her NanoChat?” But Chunk was already hustling away.

      By the time Chunk had reached the heterogenous pool, Selena was ruefully tapping the buttons on the A.P.E.
      "Just in time, I guess!" Chunk bounded up enthusiastically.
      Selena grimaced. "Not hardly. People have complained that the mess is taking up the whole corridor. I've had to decay the anomaly."
      "Shit!" cried Chunk, "If only Eats-Fruits-and-Leaves hadn't waylaid me with her mischief!"
      "Don't beat yourself up," she reassured, "We can always find a new anomaly, and you can't put a price on the entertainment value of a good clown."
      Chunk pulled himself together, and with a wan smile replied "Yeah. Clowns are great."
      "Clowns ARE great. Anyway, we still need to deal with the mess."
      "Oh yeah! It’s slurpin’ time!"

      It took him a while, but Chunk managed to suck up all the fluids that had been covering the floor and deposited them in his bucket.
      "You're sure this is still good?" he asked.
      "Perfectly fine. The ChemMasters here can even unscramble an egg!"
      Just as Chunk filled the bucket with the last of the liquid, the anomaly faded with one final pulse, spitting a shiny chemical on the floor.
      "I can't remember if that's the one they wanted separate…" mused Chunk.
      Selena was preoccupied with the anomaly core. "Hm? Oh, probably. Need another container?"
      "Nah," Chunk produced the beaker, "It’s already taken care of."

      Having finally dealt with the mess, he started towards the medical bay but was interrupted again by a raspy voice from the Supply department.
      "Over here, janitor! Chunk!" shrieked Riichinomi, "We've got a sticky situation for you"
      Chunk wandered over, "Where's the puddle, sir?"
      "Oh, not a puddle..." the vox Quartermaster hesitated. "See, all of my techs are busy generating value for NanoTrasen, and I need to be at the desk in case someone needs the department."
      Chunk nodded. He’d been the beneficiary of their work already.
      "But..." they swallowed. "Our salvage team hasn't reported in for a while. You've got experience with EVA and spaceflight. We need your help."
      It was Chunk's turn to swallow nervously. "I, uh, wasn't very skilled last time I tried..."
      "Don't worry! I'll be with you every step of the way." Riichinomi produced a handheld radio tuned to Supply frequencies. "You can do this. I believe in you."
      Chunk took the radio hesitantly, then squared his jaw. "I’ll do it. I’ll get our guys."

      ◄●●●►

      [italic]To be continued in The Zero-Sum Odyssey Book Two: Crimson Redemption, hitting bookshelves soon![/italic]






