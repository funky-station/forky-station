      [head=2]The Zero-Sum Odyssey [/head]
      [head=3]Book Three: Desolation’s Knell[/head]
      A book by Genevieve Blaine

      ================================================
      The following is a work of fiction. Any resemblance to any events or persons, living or dead, is entirely coincidental
      ================================================

      Chunk Bulkslab - stranded on the VGRoid on a mission to rescue the station’s salvagers -  crept along the path he had taken fleeing from the goliath. His hiding place seemed to be at the end of a short tunnel that had split off the main shaft - where he assumed the salvagers he was here to rescue were. But the goliath resolutely blocked his path both in and out.

      He retreated to the deepest part of his lair, and began unpacking his backpack - searching for something that could get him past the goliath. The survival kit? No, he’d already used the emergency med-pen, and he doubted the creature needed water or oxygen. The survival knife? No way, getting close up almost got him killed. The radio? Chunk stared at in horror, realising it had been transmitting the whole time. [italic]Boss must have cleared the whole channel, just so I could screw it up here,[/italic] he thought in despair. Finally, he pulled out the chemicals he’d taken from the anomaly. “I never got the chance to deliver these…” he mumbled.
      “Chunk?” beeped the pAI, “Why do you have a beaker of potassium?”
      “It’s not omnizine? Fuck, I can’t even do that right!” Chunk howled.
      “No, no, that’s perfect! Do you have any space cleaner?”
      “Uh, of course? I never leave my post without it.” Chunk was confused, but some of his pride had returned to his voice.
      “Great! Okay, so what you want to do is…”

      Just as the pAI had described, Chunk emptied one of the space cleaner bottles into the large beaker, and gingerly stalked toward the goliath. When it had just barely come into view he gritted his teeth and urged himself forward. One step, two…
      “Now!” sounded the pAI, and Chunk hurled the beaker with all his strength at the beast. A direct hit!
      As the beaker shattered, spilling its contents on the astro-sand, the pAI watched as the intelligent molecules in the space cleaner kicked in, reducing the potassium it touched to plain water. As this newly-minted water touched the rest of the potassium, it burst into flame, exposing more of the potassium to the cleaner - causing a chain reaction that engulfed the goliath in flames.
      All Chunk saw was a solid wall of yellow-orange light.

      When the flames subsided, the goliath’s flesh had burned away, leaving a dark cavity in the centre of its chitin. Chunk kicked it.
      “You know, goliaths have several useful components for salvagers…” the pAI started suggesting.
      “I’m not here for prizes, I’m here for [italic]revenge.[/italic]” Chunk paused. “Wait, I finished the revenge, I’m here for [italic]rescue.[/italic]”

      A short trek punctuated by an occasional bloodstain brought the pair to a metal structure embedded in the rock. They’d found them - Augustus Atracidae and Bantamweight Beatrix, the two missing salvagers!

      “It looks like they’re still breathing…” murmured Chunk, “and I can’t see any wounds…”
      “We should take them back to the ship - check them out clearer in atmo.” noted the pAI.
      “And drag both of them all the way back?” Chunk looked pained.
      “It’s a bit of a squeeze, but they should both fit into the crate.” The pAI indicated a steel crate with some miscellaneous scrap loaded.

      The lid wasn’t exactly secured, but it was enough to hold the bodies as they went back to the mining shuttle. Once aboard, Chunk radioed back to Riichinomi, the Quartermaster who had assigned him this duty. “Nice, Chunk! Check them out and RTB, got it?” they instructed.

      Chunk approached Augustus, and hesitantly removed the seal on his spationaut hardsuit helmet.
      Instantly, Chunk was assaulted by a foul miasma. It resembled cut grass, in the same way rotten dog food resembled a fine steak. It was all too familiar to him.
      “Interdyne Herbals. Yeuch.” He scowled. He’d hoped never to come across that stench after leaving Gorilla-X, where most of the operatives chain-smoked them.
      “Bro…” came Augustus’ quiet voice, straining with the effort of forming words, “Why’d you bogus my hotbox, bro…?”
      “Maybe because your friends on the station were worried about you?!” Chunk was incredulous.
      He opened Beatrix’ helmet as well, who coughed - spilling a handful of butts onto the shuttle floor.
      “These are illegal contraband in NanoTrasen space.” supplied the pAI.
      “Yeah - and for good reason!” Chunk fumed.
      But all Augustus could manage was a kind of wobbly shrug, before trying to find a last cigarette in the pack, failing, and falling asleep.

      Riichinomi met Chunk at the salvage dock. They clapped as Chunk, wearing a mask of disgust, dragged the salvagers’ crate on board the station. “Don’t worry about them,” they screeched, “They can go sleep it off in the brig. You, though…” Riichinomi’s raucous tone softened, as he looked at Chunk with warmth in his eyes, “Great work, Chunk. I always knew you could do it.”
      Chunk moved to salute the Quartermaster, but paused, and shared a hug with them instead.

      ◄●●●►

      It was some time later. The Command team had met in the conference room for drinks and debriefing.
      “What did you say you called this?” asked Captain Nichael Trace, to Devotion, his thaven Head of Personnel.
      “A ‘Fever Dream’, sir.” came the reply, the quotation marks audible.
      “It’s good - where did you learn how to make it?”
      Devotion raised an eyebrow. “I was not always a Head, you know.”
      “Well, cheers, then. Enjoy your plain water.”
      “I do not recall saying it was ‘plain’.” retorted Devotion with the tiniest of smirks.
      Nichael bemusedly waited for Devotion to elaborate. He refused.

      The doors opened.
      “Ah, Riich’. Good of you to join us!” grinned the captain, “Pull up a chair, and a drink.”
      But before the quartermaster could relax, he continued. “Now, I’d like to talk about the salvage situation.”
      Riichinomi looked over at Captain Trace. He still wore his bright, easygoing smile, but his blue eyes flashed with the icy chill of a captain who was worried his crew was in danger.
      “W-well… I already knew the salvagers weren’t in imminent peril - Doc let me know how they were from the crew monitor” Riichinomi raised his bottle at The Causes of Nature, CMO, who rustled in acknowledgment.
      “And, even if something did happen to the lad, we had two experienced crewmates on the scene, well, close enough to the scene.” They shuddered. Even knowing they had the right of it, Captain Trace’s steely gaze made their blood run cold.
      “So!” replied the captain, “What would you say, then, if I suggested you dragged our poor janitor into this whole situation, just to boost his career possibilities and give him more confidence…?”
      Riichinomi caught the tiniest gleam in their captain’s eyes. “Well,” they shrieked, opening their beer, “I’d say it worked, didn’t it!”
      The conference room burst into laughter.

      ◄●●●►

