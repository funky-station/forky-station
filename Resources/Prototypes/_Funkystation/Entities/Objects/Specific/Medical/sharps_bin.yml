- type: entity
  id: WallmountBin
  parent: [ BaseWallmount ,BaseStorageItem, BaseBagOpenClose ]
  abstract: true
  components:
  - type: Appearance
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 250
        layer:
        - TableLayer
        mask:
        - TableMask
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,4
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 0
            max: 1
  - type: StaticPrice
    price: 500
  - type: DnaSubstanceTrace

- type: entity
  id: WallmountBinLockable
  parent: WallmountBin
  abstract: true
  components:
  - type: GenericVisualizer
    visuals:
      enum.LockVisuals.Locked:
        lock-shaded:
          True: { state: lock-locked }
          False: { state: lock-unlocked }
      enum.SharedBagOpenVisuals.BagState:
        closeLayer:
          Open: { visible: false }
          Closed: { visible: true }
        openLayer:
          Open: { visible: true }
          Closed: { visible: false }
  - type: Lock
  - type: AccessReader

- type: entity
  id: SharpsBin
  parent: WallmountBinLockable
  name: sharps bin
  description: Dispose of those needles in their appropriate place. Safely mounted to a wall.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Medical/sharpsbin.rsi
    drawdepth: WallMountedItems
    offset: 0, 0.5
    layers:
    - state: closed
      map: [ "closeLayer" ]
    - state: open
      map: [ "openLayer" ]
    - state: lock-locked
      map: [ "lock-shaded" ]
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,3,4
    whitelist:
      tags:
      - SharpsTrash
  - type: Construction
    graph: SharpsBinGraph
    node: bin
  - type: AccessReader
    access: [ [ "Medical" ], [ "Janitor" ] ]
