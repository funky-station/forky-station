  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Janitorial/laundry_bag.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Tag
    tags:
    - LaundryBag
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Large
    whitelist:
      tags:
      - ClothMade
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
