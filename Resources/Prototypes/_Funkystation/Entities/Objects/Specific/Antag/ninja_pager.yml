- type: entity
  parent: [BaseItem, BaseHighlyIllegalContraband]
  id: NinjaPager
  name: spider clan pager
  description: A pager that can be used to call in an extraction ship once you've achieved your objectives. Must be used in deep space.
  components:
    - type: Item
      size: Tiny
      sprite: _Funkystation/Objects/Devices/ninja_pager.rsi
      inhandVisuals:
        left:
        - state: inhand-left
        - state: inhand-left-unshaded
          shader: unshaded
        right:
        - state: inhand-right
        - state: inhand-right-unshaded
          shader: unshaded
    - type: Sprite
      sprite: _Funkystation/Objects/Devices/ninja_pager.rsi
      layers:
        - state: icon
        - state: icon-unshaded
          shader: unshaded
    - type: NinjaPager
