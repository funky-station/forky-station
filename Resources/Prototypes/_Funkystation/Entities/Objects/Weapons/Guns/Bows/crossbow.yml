- type: entity
  parent: BaseItem
  name: crossbow
  id: FunkyBaseCrossbow
  description: The second rooty tooty point and shooty.
  # reference to the bow description, mostly a placeholder until
  # I can think of something better
  abstract: true
  components: #TODO: add a system for drawing the crossbow before being able to fire it
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Guns/Bows/crossbow.rsi # TEMPORARY
  - type: Item
    size: Large
  - type: Wieldable
  - type: UseDelay
    delay: 2.5 # until a drawing system can be implemented
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 2
    fireRate: 1
    projectileSpeed: 35 # base for now, here for reference as a reminder
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        startingItem: null
        priority: 1
        whitelist:
          tags:
          - BoltAmmo
  - type: ContainerContainer
    containers:
      gun_chamber: !type:ContainerSlot
  - type: ChamberMagazineAmmoProvider
    autoCycle: false
    boltClosed: false
    canRack: false
    soundBoltClosed: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
    soundBoltOpened: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
    soundRack: /Audio/Weapons/Guns/Cock/revolver_cock.ogg

- type: entity
  parent: FunkyBaseCrossbow
  abstract: true
  id: FunkyBaseCrossbowCompound
  name: compound crossbow
  components:
  - type: Sprite #currently colours are just the regions of the crossbow
    sprite: _Funkystation/Objects/Weapons/Guns/Bows/compound-crossbow.rsi # ignore the 64x one
    layers:
    - state: undrawn
      map: [ base ]
    - state: drawn-bolt
      map: [ bolt ]
      visible: false
    - type: Appearance
    - type: ItemMapper
      spriteLayers:
      - bolt
      mapLayers:
        bolt:
          whitelist:
            tags:
            - Bolt
  - type: BreechLoaded
    ToggleDelay: 3
    openSound: # temporary sound
      path: "/Audio/Items/bow_pull.ogg"
    closeSound:
      path: "/Audio/Weapons/Guns/Misc/arrow_nock.ogg"
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: drawn }
          False: { state: undrawn }
  - type: Clothing
    quickEquip: false
    slots:
    - Back


- type: entity
  parent: [ FunkyBaseCrossbowCompound, BaseSecurityContraband]
  id: FunkyCrossbowSecurity
  name: AGIES security crossbow
  description: "With the all new AGIES Security crossbow you don't have to worry about silly things like trigger discipline, because crossbows are obviously less dangerous then a gun! (Disclaimer: AGIES Security is not responsible for any injuries this causes)"
  #components: # TODO: finish it's own sprite
