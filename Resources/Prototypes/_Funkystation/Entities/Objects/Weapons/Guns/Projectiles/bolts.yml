- type: entity
  abstract: true
  parent: [ BaseItem ] # no Solution Dart because that isn't for every bolt
  id: FuBaseBolt
  suffix: Deprecated
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Guns/Projectiles/bolts.rsi #Sprites are not done and are pretty much just the arrow sprites
  - type: Item
    size: Small
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      projectile:
        shape:
          !type:PhysShapeAabb # no idea what this is for but it's in the arrow so I'm putting it here so I don't crash the game
          bounds: "-0.1,-0.3,0.2,-0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: ThrowingAngle
    angle: 0
  - type: Ammo
    muzzleFlash: null
  - type: Tag
    tags:
    - Bolt
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Piercing: 35
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: FuBaseBolt
  abstract: true
  id: FuBaseBoltEmbed
  components:
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    embedOnThrow: false
  # TODO: use trigger on unembed to maybe have damage when removed?

- type: entity
  parent: [ FuBaseBoltEmbed, BaseSecurityContraband ]
  id: FuBoltLessLethal
  name: rubber bolt
  description: A bolt with a rounder rubber tip. It still hurts though.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-rounded
      color: black
  - type: Projectile # tried to make it so it doesn't embed into people and either pierces or just bounces and drops onto the ground, failed
    damage:
      types:
        Blunt: 27 # Still lethal
  - type: StunOnCollide
    slowdownAmount: 2
    walkSpeedModifier: 0.75
    sprintSpeedModifier: 0.75
  - type: StaminaDamageOnCollide # TODO: add bluntStaminaDamageFactor to projectile so it can be used here
    damage: 35





- type: entity
  parent: [ FuBaseBoltEmbed, BaseSecurityContraband ]
  id: FuBoltLethal
  name: crossbow bolt
  description: A crossbow bolt with a sharp tip.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-pointed
      color: gray




  # Misc bolts

- type: entity
  parent: [ FuBaseBoltEmbed, BaseSyndicateContraband]
  id: FuBoltHypo
  name: hypo bolt
  description: A bolt made to quickly inject chemicals into someone, doesn't hurt as much compared to a normal bolt but is still lethal.
  components:
  - type: Sprite # will give a different sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-pointed
      color: white
    - state: solution1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Projectile
    damage:
      types:
        Piercing: 25
  - type: Solution
    id: hypo
    solution:
      maxVol: 10
  - type: SolutionInjectOnEmbed
    transferAmount: 10
    solution: hypo
  - type: RefillableSolution
    solution: hypo
  - type: InjectableSolution
    solution: hypo
  - type: SolutionTransfer
    maxTransferAmount: 5
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: solution


