- type: entity
  abstract: true
  parent: BaseStorageItem
  id: BaseWallet
  name: wallet
  description: A wallet that stores your ID, and other bits and ends.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/wallet.rsi
    state: icon-base
  - type: Icon
    sprite: _Funkystation/Objects/Misc/wallet.rsi
    state: icon-base
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: false
    slots:
    - idcard
    - Belt
  - type: Pda
    idSlot:
      name: access-id-card-component-default
      ejectSound: !type:SoundCollectionSpecifier
        collection: storageRustle
      insertSound: !type:SoundCollectionSpecifier
        collection: storageRustle
      whitelist:
        components:
        - IdCard
    penSlot:
      startingItem: Pen
      priority: -1
      whitelist:
        tags:
        - Write
    paiSlot:
      locked: true
      whitelist:
        components:
        - PAI
  - type: ItemSlots
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Tiny
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      PDA-id: !type:ContainerSlot {}
      PDA-pen: !type:ContainerSlot {}
      PDA-pai: !type:ContainerSlot {}
  - type: ItemMapper
    mapLayers:
      icon-no-id:
        minCount: 0
        maxCount: 0
        whitelist:
          components:
          - IdCard
      icon-id:
        whitelist:
          components:
          - IdCard
      icon-pager:
        whitelist:
          components:
          - Pager
  - type: Appearance
  - type: Tag
    tags:
    - DoorBumpOpener
    - WhitelistChameleon
    - WhitelistChameleonPDA

