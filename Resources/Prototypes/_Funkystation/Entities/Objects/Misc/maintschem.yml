# breakables

- type: entity
  parent: [BaseItem, DrinkBaseMaterialGlass]
  id: SpecimenJar
  name: old specimen jar
  description: A large glass jar full of... Something...
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Maintschem/specimen_jar.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,1,1
  - type: Solution
    solution:
      reagents:
      - ReagentId: Benzene
        Quantity: 120
      - ReagentId: Phenol
        Quantity: 120
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpillBehavior
        solution: solution
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
          OrganGrayBrain:
            min: 1
            max: 1
        transferForensics: true
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: [BaseItem, DrinkBaseMaterialGlass]
  id: OldThermometer
  name: old thermometer
  description: An old thermometer. Doesn't really seem to work anymore.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Maintschem/old_thermometer.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,0,1
  - type: Solution
    solution:
      reagents:
      - ReagentId: Mercury
        Quantity: 60
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpillBehavior
        solution: solution
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
  - type: Tag
    tags:
    - Trash
