    sprite: _Funkystation/Objects/Misc/Maintschem/antacids.rsi
    state: tablet
  - type: Solution
    solution:
      reagents:
      - ReagentId: SodiumCarbonate
        Quantity: 15
      - ReagentId: Hydroxide
        Quantity: 15
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
    - sweet
    - chewy
  - type: Tag
    tags:
    - FoodSnack

- type: entity
  parent: BoxCardboard
