  - type: Storage
    maxItemSize: Tiny
    grid:
    - 0,0,2,2
    whitelist:
      tags:
      - FoodSnack
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Maintschem/antacids.rsi
    state: box
  - type: EntityTableContainerFill
    containers:
      storagebase:
