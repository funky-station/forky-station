- type: entity
  parent: [ReagentPacket, ItemHeftyBase]
  id: ReagentContainerBleach
  name: thing of bleach
  description: A jug of bleach. Doesn't go well with vodka.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Maintschem/bleach.rsi
    layers:
    - state: icon
      map: [ "enum.OpenableVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: {state: "icon_open"}
          False: {state: "icon"}
  - type: Edible
    edible: Drink
  - type: Solution
    solution:
      reagents:
      - ReagentId: Bleach
        Quantity: 120

