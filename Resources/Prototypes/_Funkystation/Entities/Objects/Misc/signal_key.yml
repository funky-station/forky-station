- type: entity
  abstract: true
  parent: BaseItem
  id: FuBaseSignalKey
  name: key
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/key.rsi
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Funkystation/Items/Handling/key_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Funkystation/Items/Handling/key_drop.ogg
      params:
        volume: -4
  - type: UseDelay
    delay: 3
  - type: EmitSoundOnUse
    sound:
      collection: KeyJingle
  - type: Whistle
    distance: 3
  - type: SignalKey

- type: entity
  parent: FuBaseSignalKey
  id: FuKeyDqm
  name: deputy quartermaster's key
  suffix: dQM
  description: A key that gives the Deputy Quartermaster access to the Quartermaster's office, as long as the secondary lock is open.
  components:
  - type: Sprite
    state: logdep
  - type: SignalKey
    keyType: dQM

