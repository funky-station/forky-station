- type: entity
  id: FunkyInflatableWallStack
  parent: BaseItem
  name: inflatable barricade
  description: A folded membrane which rapidly expands into an airtight barricade on activation.
  suffix: Full
  components:
  - type: Stack
    stackType: FunkyInflatableWall
    count: 5
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/inflatables.rsi
    state: item_wall
  - type: Item
    sprite: _Funkystation/Objects/Misc/inflatables.rsi
    size: Tiny
  - type: SpawnAfterInteract
    prototype: FunkyInflatableWall
    doAfter: 0.5
    removeOnInteract: true
  - type: Clickable
  - type: PhysicalComposition
  - type: Tag
    tags:
    - Inflatable

