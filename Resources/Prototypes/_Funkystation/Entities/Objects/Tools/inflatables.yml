- type: entity
  name: inflatable floor
  id: FunkyInflatableFloorStack
  parent: BaseItem
  description: A folded membrane that rapidly expands into airtight plating upon activation. Must be deployed on space directly. Can be pryed up.
  suffix: Full
  components:
  - type: Stack
    stackType: FunkyInflatableFloor
    count: 8
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/inflatables.rsi
    state: item_floor
  - type: Item
    sprite: _Funkystation/Objects/Misc/inflatables.rsi
    size: Tiny
  - type: FloorTile
    outputs:
    - FunkyInflatablePlating
  - type: Tag
    tags:
    - Inflatable
  - type: GuideHelp
    guides:
    - ExpandingRepairingStation

