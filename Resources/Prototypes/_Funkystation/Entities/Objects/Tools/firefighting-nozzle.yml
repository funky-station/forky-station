- type: entity
  id: FirefighterNozzle
  parent: BaseItem
  name: firefighter nozzle
  description: A specialized nozzle intended to fight fires.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Guns/Basic/extinguishernozzle.rsi
    state: icon
  - type: Item
    sprite: _Funkystation/Objects/Weapons/Guns/Basic/extinguishernozzle.rsi
    size: Normal
  - type: FirefighterTankRefillable
    externalContainer: true
    targetSlot: BACK
    providerWhitelist:
      tags:
      - AtmosBackTank
  - type: Tag
    tags:
    - Nozzle

  - type: Spray
    transferAmount: 15
    pushbackAmount: 60
    spraySound:
      path: /Audio/Effects/extinguish.ogg
    sprayedPrototype: ExtinguisherSpray
    vaporAmount: 5
    vaporSpread: 120
    sprayDistance: 5
    sprayVelocity: 2.0
    externalContainer: true
    targetSlot: BACK
    providerWhitelist:
      tags:
      - NozzleBackTank
      - AtmosBackTank
  - type: UseDelay
  - type: PacifismAllowedGun
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Effects/thunk.ogg
    soundEmpty:
      path: /Audio/Items/hiss.ogg
    clumsyProof: true
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - NozzleBackTank
      - AtmosBackTank
    checkHands: true

- type: entity
  parent: [ BaseCivilianContraband, GrenadeBase ]
  categories: [ HideSpawnMenu ]
  id: AtmosResin
  name: atmos resin
  description: Special grenade for atmosians.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Weapons/Grenades/frozen-smoke-capsule.rsi
    state: icon
  - type: SmokeOnTrigger
    duration: 9
    spreadAmount: 1000 # Overly high number so resin spreads more evenly. Capped by duration.
    smokePrototype: Resin
  - type: DeleteOnTrigger
  - type: TriggerOnLand
  - type: TimerTriggerVisuals
  - type: EmitSoundOnTrigger
    sound: /Audio/Items/smoke_grenade_smoke.ogg
    positional: true
