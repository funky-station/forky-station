- type: entity
  abstract: true
  parent: BaseItem
  id: FuGlowstickBase
  name: glowstick
  description: A single-use glowstick, useful in raves and emergencies.
  components:
  - type: SpaceGarbage
  - type: ExpendableLight
    glowDuration: 900 # time in seconds
    fadeOutDuration: 300
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    iconStateLit: icon-lit
    iconStateSpent: icon
    litSound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
  - type: Sprite
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: icon
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: icon
  - type: Clothing
    quickEquip: false
    slots:
    - neck
  - type: Item
    size: Tiny
    heldPrefix: unlit
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#F6F7E9"
    radius: 4
    energy: 0
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour # slowly fade in once activated
      id: turn_on
      interpolate: Linear
      maxDuration: 10.0
      startValue: 0.0
      endValue: 3.0
      property: Energy
    - !type:FadeBehaviour # fade out energy as it burns out
      id: fade_out
      interpolate: Linear
      maxDuration: 10 # 300.0
      startValue: 3.0
      endValue: 0.2
      property: Energy
    - !type:FadeBehaviour # fade out radius as it burns out
      id: fade_out
      interpolate: Linear
      maxDuration: 10 # 300.0
      startValue: 5.0
      endValue: 1.5
  - type: Tag
    tags:
    - Trash

