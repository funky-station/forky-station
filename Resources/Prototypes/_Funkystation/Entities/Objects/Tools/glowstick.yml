# Glowstick Pack, Gives you all 5 of the base glowsticks

- type: entity
  parent: BaseItem
  id: FuGlowstickPack
  name: glowstick pack
  description: A pack of five Glow-Sprite glowsticks, meant to be broken into for raves and emergencies.
  components:
  - type: Item
    sprite: _Funkystation/Objects/Misc/Glowsticks/pack.rsi
    size: Small
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Glowsticks/pack.rsi
    state: icon
  - type: SpawnItemsOnUse
    items:
    - id: FuGlowstickRed
    - id: FuGlowstickYellow
    - id: FuGlowstickGreen
    - id: FuGlowstickBlue
    - id: FuGlowstickPurple
    - id: FuGlowstickPackTrash
    sound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg

- type: entity
  parent: FoodPacketTrash
  id: FuGlowstickPackTrash
  name: glowstick pack label
  description: The discarded label of a pack of Glow-Sprite glowsticks.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/Glowsticks/pack.rsi
    state: trash
  - type: Item
    sprite: _Funkystation/Objects/Misc/Glowsticks/pack.rsi
    heldPrefix: trash
