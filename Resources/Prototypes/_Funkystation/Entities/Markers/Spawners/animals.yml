- type: entity
  parent: MarkerBase
  id: SpawnMobDuckGeneric
  name: Generic Duck Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - state: ai
  - type: EntityTableSpawner
    table: !type:GroupSelector
      children:
      - id: MobDuckMallard
      - id: MobDuckWhite
      - id: MobDuckBrown

- type: entity
  parent: MarkerBase
  id: SpawnMobDuckMallard
  name: Mallard Duck Spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - state: duck-0
      sprite: Mobs/Animals/duck.rsi
  - type: ConditionalSpawner
    prototypes:
    - MobDuckMallard

