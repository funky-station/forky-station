- type: entity
  parent: BaseStructure
  id: BasePlatform
  abstract: true
  name: platform
  description: Basic platform meant to protect idiots like you from falling.
  components:
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Walls/platform.rsi
  - type: Icon
    sprite: _Funkystation/Structures/Walls/platform.rsi
  - type: Physics
    bodyType: Static
  - type: InteractionOutline
  - type: Repairable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: FlimsyMetallic
  - type: Climbable
  - type: RCDDeconstructable
    cost: 20 # Funkystation
    delay: 2
    fx: EffectRCDDeconstruct2

- type: entity
  parent: BasePlatform
  id: Platform
  components:
  - type: Sprite
    state: side
  - type: Icon
    state: side
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

