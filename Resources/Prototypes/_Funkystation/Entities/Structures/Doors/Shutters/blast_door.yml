- type: entity
  parent: BlastDoor
  id: BlastDoorSecurityLocked
  suffix: Security, Locked
  components:
  - type: AccessReader
    containerAccessProvider: board
  - type: Door
    closeTimeOne: 0.4
    closeTimeTwo: 0.4
    openTimeOne: 0.4
    openTimeTwo: 0.4
    openingAnimationTime: 1.0
    closingAnimationTime: 1.0
    canPry: false
    crushDamage:
      types:
        Blunt: 25 # yowch
    openSound:
      path: /Audio/Machines/blastdoor.ogg
    closeSound:
      path: /Audio/Machines/blastdoor.ogg
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsSecurity ]
  - type: Construction
    graph: BlastDoor
    node: blastdoor
    containers:
    - board

- type: entity
  parent: BlastDoorSecurityLocked
  id: BlastDoorSecurityLockedOpen
  suffix: Security, Locked, Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false
