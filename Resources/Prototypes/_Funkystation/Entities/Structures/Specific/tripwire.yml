- type: entity
  parent: BaseStructure
  id: FuTripwire
  name: tripwire
  description: Twang!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Launchers/sticky_hand.rsi
    layers:
    - state: rope
  - type: Appearance
  - type: Slippery
    ignoreNoSlip: true
    affectsSliding: true
    slipData:
      stunTime: 1.2
      knockdownTime: 2
      launchForwardsMultiplier: 0.5
  - type: StepTrigger
    intersectRatio: 0.2
  - type: TriggerOnStepTrigger
  - type: SignalOnTrigger
  - type: DamageOnTrigger
    damage:
      types:
        Slash: 20
  - type: CollisionWake
    enabled: false
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        layer:
        - SlipLayer
        hard: false
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.3,0.4,0.3"
        density: 10
        mask:
        - ItemMask
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          CableApcStack1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
