# lockable buttons alt offset
- type: entity
  parent: SignalButtonDirectional
  id: LockableButtonAlt1
  name: lockable button
  categories: [ HideSpawnMenu ]
  components:
    - type: Lock
    - type: AccessReader
    - type: Sprite
      offset: -0.315, -0.25
      drawdepth: WallMountedItems
      sprite: Structures/Wallmounts/switch-lockable.rsi
      layers:
        - state: base
        - state: button
        - state: button-unshaded
          shader: unshaded
        - map: [ "lock-shaded" ]
          state: lock-locked
        - map: [ "lock-unshaded" ]
          state: lock-locked-unshaded
          shader: unshaded
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.LockVisuals.Locked:
          lock-shaded:
            True: { state: lock-locked }
            False: { state: lock-unlocked }
          lock-unshaded:
            True: { state: lock-locked-unshaded }
            False: { state: lock-unlocked-unshaded }

- type: entity
  parent: LockableButtonAlt1
  id: LockableButtonCaptainAlt1
  suffix: Captain, Left
  components:
    - type: AccessReader
      access: [["Captain"]]

