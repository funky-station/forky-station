# switch frames alt offset
- type: entity
  parent: StructureHealthFurnitureWeak
  id: ButtonFrameGreyAlt1
  suffix: Left
  name: button frame
  description: It's a frame to help distinguish switches visually.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: -0.315, -0.25
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/switch-frame.rsi
    state: grey
  - type: Clickable
  - type: WallMount
    arc: 175
  - type: Physics
    canCollide: false
  - type: Rotatable
  - type: Fixtures

- type: entity
  id: ButtonFrameCautionAlt1
  parent: ButtonFrameGreyAlt1
  suffix: caution, Left
  components:
  - type: Sprite
    state: caution

- type: entity
  id: ButtonFrameCautionSecurityAlt1
  parent: ButtonFrameGreyAlt1
  suffix: caution, Left
  components:
  - type: Sprite
    state: caution-security

- type: entity
  id: ButtonFrameWhiteAlt1
  parent: ButtonFrameGreyAlt1
  suffix: white, Left
  components:
  - type: Sprite
    state: white

- type: entity
  id: ButtonFrameJanitorAlt1
  parent: ButtonFrameGreyAlt1
  suffix: janitor, Left
  components:
  - type: Sprite
    state: janitor

