# switch frames alt offset
- type: entity
  parent: StructureHealthFurnitureWeak
  id: ButtonFrameGreyAlt1
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Wallmounts/switch_frame_atl1.rsi
    state: grey
  - type: Clickable
  - type: WallMount
    arc: 175
  - type: Physics
    canCollide: false
  - type: Rotatable
  - type: Fixtures

- type: entity
  id: ButtonFrameCautionAlt1
  parent: ButtonFrameGreyAlt1
  suffix: caution
  components:
  - type: Sprite
    state: caution

- type: entity
  id: ButtonFrameCautionSecurityAlt1
  parent: ButtonFrameGreyAlt1
  suffix: caution
  components:
  - type: Sprite
    state: caution-security

- type: entity
  id: ButtonFrameWhiteAlt1
  parent: ButtonFrameGreyAlt1
  suffix: white
  components:
  - type: Sprite
    state: white

- type: entity
  id: ButtonFrameJanitorAlt1
  parent: ButtonFrameGreyAlt1
  suffix: janitor
  components:
  - type: Sprite
    state: janitor

