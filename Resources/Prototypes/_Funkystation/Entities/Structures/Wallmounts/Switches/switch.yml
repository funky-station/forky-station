# Alt offsets for switches/buttons
- type: entity
  parent: SignalSwitch
  id: SignalSwitchAlt1
  name: signal switch
  description: It's a switch for toggling power to things.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt1.rsi
    layers:
    - state: base
    - map: [ "shaded" ]
      state: off
    - map: [ "unshaded" ]
      state: off-unshaded
      shader: unshaded

- type: entity
  parent: SignalButton
  id: SignalButtonAlt1
  name: signal button
  description: It's a button for activating something.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt1.rsi
    layers:
    - state: base
    - state: button
    - state: button-unshaded
      shader: unshaded

