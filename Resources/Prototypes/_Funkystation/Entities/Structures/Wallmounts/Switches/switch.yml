# Alt offsets for switches/buttons
- type: entity
  parent: SignalSwitch
  id: SignalSwitchAlt1
  name: signal switch
  description: It's a switch for toggling power to things.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt1.rsi
    layers:
    - state: base
    - map: [ "shaded" ]
      state: off
    - map: [ "unshaded" ]
      state: off-unshaded
      shader: unshaded

- type: entity
  parent: SignalButton
  id: SignalButtonAlt1
  name: signal button
  description: It's a button for activating something.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt1.rsi
    layers:
    - state: base
    - state: button
    - state: button-unshaded
      shader: unshaded

- type: entity
  parent: SignalSwitch
  id: SignalSwitchAlt2
  name: signal switch
  description: It's a switch for toggling power to things.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt2.rsi
    layers:
    - state: base
    - map: [ "shaded" ]
      state: off
    - map: [ "unshaded" ]
      state: off-unshaded
      shader: unshaded

- type: entity
  parent: SignalButton
  id: SignalButtonAlt2
  name: signal button
  description: It's a button for activating something.
  components:
  - type: Sprite
    offset: 0, -0.25
    drawdepth: WallMountedItems
    sprite: _Funkystation/Structures/Wallmounts/switch_alt2.rsi
    layers:
    - state: base
    - state: button
    - state: button-unshaded
      shader: unshaded

# lockable buttons alt offset
- type: entity
  parent: SignalButtonDirectional
  id: LockableButtonAlt1
  name: lockable button
  categories: [ HideSpawnMenu ]
  components:
    - type: Lock
    - type: AccessReader
    - type: Sprite
      offset: 0, -0.25
      drawdepth: WallMountedItems
      sprite: _Funkystation/Structures/Wallmounts/switch_lockable_alt1.rsi
      layers:
        - state: base
        - state: button
        - state: button-unshaded
          shader: unshaded
        - map: [ "lock-shaded" ]
          state: lock-locked
        - map: [ "lock-unshaded" ]
          state: lock-locked-unshaded
          shader: unshaded
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.LockVisuals.Locked:
          lock-shaded:
            True: { state: lock-locked }
            False: { state: lock-unlocked }
          lock-unshaded:
            True: { state: lock-locked-unshaded }
            False: { state: lock-unlocked-unshaded }

- type: entity
  parent: LockableButtonAlt1
  id: LockableButtonCaptainAlt1
  suffix: Captain
  components:
    - type: AccessReader
      access: [["Captain"]]

