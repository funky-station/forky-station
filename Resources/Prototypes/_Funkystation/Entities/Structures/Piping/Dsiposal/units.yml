- type: entity
  parent: StructureHealthMachineWeak
  id: DisposalMachineFrameWallmount
  name: high pressure machine frame
  description: A machine frame made to withstand the amount of pressure used in the station's disposal system.
  placement:
    mode: SnapgridCenter
  components:
    - type: Transform
      anchored: true
      noRot: true
    - type: Physics
      bodyType: Static
    - type: Clickable
    - type: InteractionOutline
    - type: Anchorable
    - type: Pullable
    - type: Construction
      graph: DisposalMachineWallmount
      node: frame
    - type: Damageable
      damageModifierSet: SteelMod
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:ChangeConstructionNodeBehavior
              node: start
    - type: Sprite
      offset: 0, 0.75
      sprite: _Funkystation/Structures/Piping/wall-high-pressure-machine-frame.rsi
      layers:
        - state: frame
          map: [ "enum.ConstructionVisuals.Layer" ]
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.ConstructionVisuals.Key:
          enum.ConstructionVisuals.Layer:
            frame_cable: { state: frame_cables }
            frame_electronics: { state: frame_electronics }
            frame_unit: { state: frame_unit }

- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineWeak ]
  id: DisposalUnitWallmount
  name: disposal unit
  description: A pneumatic waste disposal unit.
  components:
  - type: Sprite
    offset: 0, 0.75
    sprite: _Funkystation/Structures/Piping/walldispo.rsi
    layers:
    - map: [ "enum.DisposalUnitVisualLayers.Base" ]
      state: disposal
    - map: [ "enum.DisposalUnitVisualLayers.OverlayFlushing" ]
      state: disposal-flush
      visible: false
    - map: [ "enum.DisposalUnitVisualLayers.OverlayCharging" ]
      state: dispover-ready
    - map: [ "enum.DisposalUnitVisualLayers.OverlayFull" ]
      state: dispover-full
      visible: false
    - map: [ "enum.DisposalUnitVisualLayers.OverlayEngaged" ]
      state: dispover-handle
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.DisposalUnitVisuals.IsReady:
        enum.DisposalUnitVisualLayers.Base:
          True: { state: disposal }
          False: { state: disposal-charging }
      enum.DisposalUnitVisuals.IsFlushing:
        enum.DisposalUnitVisualLayers.OverlayFlushing:
          True: { visible: true }
          False: { visible: false }
      enum.DisposalUnitVisuals.IsEngaged:
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          True: { visible: true }
          False: { visible: false }
      enum.DisposalUnitVisuals.IsCharging:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          True: { state: dispover-charge, visible: true }
          False: { state: dispover-ready, visible: true }
      enum.DisposalUnitVisuals.IsFull:
        enum.DisposalUnitVisualLayers.OverlayFull:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.DisposalUnitVisualLayers.OverlayCharging:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayFull:
          False: { visible: false }
      enum.AnchorVisuals.Anchored:
        enum.DisposalUnitVisualLayers.Base:
          True: { state: disposal }
          False: { state: condisposal }
        enum.DisposalUnitVisualLayers.OverlayEngaged:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayCharging:
          False: { visible: false }
        enum.DisposalUnitVisualLayers.OverlayFull:
          False: { visible: false }
  - type: DisposalUnit
    container:
      occludes: true
      showEnts: false
      ents: [ ]
    whitelist:
      components:
      - Item
      - Body
  - type: Climbable
    vaultable: false
  - type: Damageable
    damageModifierSet: PlasticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 0
            max: 1
          SheetSteel1:
            min: 0
            max: 1
      - !type:EmptyContainersBehaviour
        containers:
        - DisposalUnitComponent
      - !type:ChangeConstructionNodeBehavior
        node: frame
  - type: Appearance
  - type: UserInterface
    interfaces:
      enum.DisposalUnitUiKey.Key:
        type: DisposalUnitBoundUserInterface
  - type: ContainerContainer
    containers:
      DisposalUnitComponent: !type:Container
  - type: StaticPrice
    price: 70
  - type: PowerSwitch
  - type: ApcPowerReceiver
    powerLoad: 5
  - type: PowerState
    idlePowerDraw: 5
    workingPowerDraw: 1000
  - type: ThrowInsertContainer
    containerId: DisposalUnitComponent
    probability: 0.67
  - type: Rummageable
    table: !type:NestedSelector
      tableId: RatKingLoot
  - type: RequireProjectileTarget
  - type: Construction
    graph: DisposalMachineWallmount
    node: disposal_unit

- type: entity
  parent: DisposalPipeBase
  id: DisposalTrunkWallmount
  name: wallmount disposal trunk
  description: A pipe trunk used as an entry point for wallmount disposal systems.
  components:
    - type: Sprite
      offset: 0, 0.5
      sprite: _Funkystation/Structures/Piping/walldispotrunk.rsi
      layers:
        - map: [ "pipe" ]
          state: conpipe-lt
    - type: DisposalTube
    - type: DisposalEntry
    - type: GenericVisualizer
      visuals:
        enum.AnchorVisuals.Anchored:
          pipe:
            False: { state: conpipe-lt }
            True: { state: pipe-lt }
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.5,0.25,1.4"
          mask:
            - SubfloorMask
    - type: Construction
      graph: DisposalPipe
      node: trunk
