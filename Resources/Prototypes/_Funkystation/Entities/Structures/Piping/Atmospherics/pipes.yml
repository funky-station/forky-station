# if the base yaml get updated at some point this is gonna be out of date as fuuuu

- type: entity
  abstract: true
  parent: BaseItem
  id: GasPipeSansLayersIndestructibleNoRestrict
  name: gas pipe
  description: Holds gas.
  placement:
    mode: SnapgridCenter
  components:
  - type: Visibility
    layer: 1
  - type: Item
    size: Normal
  - type: Transform
    anchored: true
  - type: SubFloorHide
  - type: CollideOnAnchor
  - type: Anchorable
  - type: Rotatable
    increment: 90
  - type: Sprite
    sprite: _Funkystation/Structures/Piping/Atmospherics/pipe.rsi # Funky
    drawdepth: ThinPipe
    visible: false
  - type: Appearance
  - type: PipeAppearance
  - type: PipeColorVisuals
  - type: NodeContainer
  # - type: PipeRestrictOverlap (Omitted here)
  - type: AtmosUnsafeUnanchor
  - type: AtmosPipeColor
  - type: AtmosMonitoringConsoleDevice
  - type: Tag
    tags:
    - Pipe
  - type: Physics
    canCollide: false
    bodyType: static
  - type: StaticPrice
    price: 30

- type: entity
  abstract: true
  parent: [ GasPipeSansLayersIndestructibleNoRestrict, StructureHealthContainer ]
  id: GasPipeSansLayersNoRestrict
  components:
  - type: RCDDeconstructable
    cost: 5
    delay: 2
    fx: EffectRCDDeconstruct2
    rpd: true
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: # regular damage trigger (replace with broken pipe)
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          GasPipeBroken:
            min: 1
            max: 1
        offset: 0

- type: entity
  abstract: true
  parent: [ GasPipeSansLayersNoRestrict, BaseGasPipeLayers ]
  id: GasPipeBaseNoRestrict
