- type: supermatterAlertLevel
  id: Stable

  lowerThreshold: 100
  lowerState: Active
  upperThreshold: 100
  upperState: Stable


  announceDecreaseToStation: false
  announceIncreaseToStation: false

  radioChannels:
  - Engineering

  increasingRadioMessage: supermatter-announcement-stable-recover-radio
  decreasingRadioMessage: supermatter-announcement-stable-warning-radio

  increasingAnnouncementMessage: supermatter-announcement-stable-recover-announcement
  decreasingAnnouncementMessage: supermatter-announcement-stable-warning-announcement

