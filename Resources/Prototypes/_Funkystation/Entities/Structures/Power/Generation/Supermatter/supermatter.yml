- type: entity
  id: Supermatter
  parent: BaseStructure
  name: supermatter crystal
  description: A fragile crystalline structure formed where energy from an extra dimensional plane leaks into our universe. Handle with extreme care.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Funkystation/Structures/Power/Generation/Supermatter/supermatter.rsi
    offset: "0, 0.25"
    layers:
    - map: [ "State" ]
      state: supermatter
      shader: unshaded

  - type: Supermatter
    activated: true
    power: 0
    integrity: 1000
    maxIntegrity: 1000
    delamTimer: 30
    baseRadiation: 3
    powerPercentage: 0.005
    radiationDamageMultiplier: 10
    neutralStability: 10
    baseStability: 0
    baseGrowth: 0
    baseConductivity: 0
    baseEnthalpy: 0
    reproductionThreshold: 1000
    reproductionDecay: 0.9
    powerDamageScale: 500
    temperatureDamageScale: 10
    absorptionHealing: 1
    absorptionHealingCost: 10
    growthAbsorptionScale: 45
    powerPerGasPacket: 3000
    stabilityPowerDrainScale: 0.05
    integrityChangeCap: 2
    powerScalingFactor: 1000
    integrityDivisor: 10
    vacuumDamagePerTile: 1.1
    vacuumThreshold: 10
    ratioPerTile: 0.05
    RadiationDamageTypes:
    - Radiation
    AbsorbedGas: {}
    anomalyMinPower: 5000
    anomalyMinConductivity: 0

  - type: AtmosDevice
    requireAnchored: false
    joinSystem: true
  - type: RadiationSource
    intensity: 0

  - type: Damageable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.4"
        density: 190
        hard: true
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: WarpPoint
    follow: true
    location: supermatter
  - type: Transform
    anchored: true
    noRot: true
  - type: PointLight
    enabled: true
    radius: 10
    energy: 2
    color: "#ffe000"
  - type: AmbientSound
    range: 20
    volume: -5
    sound:
      path: /Audio/_Funkystation/Supermatter/calm.ogg
  - type: GuideHelp
    guides:
    - Supermatter
    - Power
  - type: DeviceLinkSource
    ports:
    - SupermatterInactive
    - SupermatterNormal
  - type: SinguloFood
    energy: 10000
  - type: Pullable
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SupermatterVisualKeys.State:
       State:
          0:
            sprite: _Funkystation/Structures/Power/Generation/Supermatter/supermatter.rsi
            state: supermatter
          1:
            sprite: _Funkystation/Structures/Power/Generation/Supermatter/supermatter.rsi
            state: supermatter-glow
          2:
            sprite: _Funkystation/Structures/Power/Generation/Supermatter/supermatter.rsi
            state: supermatter-glow-emergency
          3:
            sprite: _Funkystation/Structures/Power/Generation/Supermatter/supermatter.rsi
            state: supermatter-glow-delam
