- type: entity
  parent: BaseComputerAiAccess
  id: ComputerXoRecords
  name: station records publishing console
  description: A console used to manually update and publish crew records.
  components:
  - type: XoRecordsConsole
  - type: ActivatableUI
    key: enum.XoRecordsConsoleKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["HeadOfPersonnel"]]
  - type: UserInterface
    interfaces:
      enum.XoRecordsConsoleKey.Key:
        type: XoRecordsConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: XoRecordsComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
