- type: entity
  id: CargoTechFab
  parent: BaseLatheLube
  name: cargo techfab
  description: Prints equipment for use by cargo personnel.
  components:
  - type: Sprite
    sprite: Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: cargo
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Lathe
    idleState: icon
    runningState: icon
    staticPacks:
    - CargoStatic
    - MaterialsStatic
    - CargoBoardsStatic 
    dynamicPacks:
    - Equipment
    - ScienceClothing
    - Mining
    - CargoBoards
    - SalvageSecurityBoards
    - SalvageSecurityWeapons
    - ShuttleBoards
  - type: EmagLatheRecipes
  - type: Machine
    board: CargoTechFabCircuitboard
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget    