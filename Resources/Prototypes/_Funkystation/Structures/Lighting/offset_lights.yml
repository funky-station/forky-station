#emergency lights
- type: entity
  parent: EmergencyLight
  id: EmergencyLightLeft
  suffix: Left
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/Lighting/emergency-light.rsi
    offset: -0.25, 1.25
    layers:
    - state: base
      map: [ "enum.EmergencyLightVisualLayers.Base" ]
    - state: emergency_light_off
      map: [ "enum.EmergencyLightVisualLayers.LightOff" ]
      color: "#7CFC00"
    - state: emergency_light_on
      map: [ "enum.EmergencyLightVisualLayers.LightOn" ]
      color: "#7CFC00"
      shader: "unshaded"
      visible: false
  - type: Construction
    graph: LightFixtureOffset
    node: emergencyLight_left

- type: entity
  parent: EmergencyLight
  id: EmergencyLightRight
  suffix: Right
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/Lighting/emergency-light.rsi
    offset: 0.25, 1.25
    layers:
    - state: base
      map: [ "enum.EmergencyLightVisualLayers.Base" ]
    - state: emergency_light_off
      map: [ "enum.EmergencyLightVisualLayers.LightOff" ]
      color: "#7CFC00"
    - state: emergency_light_on
      map: [ "enum.EmergencyLightVisualLayers.LightOn" ]
      color: "#7CFC00"
      shader: "unshaded"
      visible: false
  - type: Construction
    graph: LightFixtureOffset
    node: emergencyLight_right
