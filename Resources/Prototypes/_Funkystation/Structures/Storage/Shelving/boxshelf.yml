- type: entity
  parent: BaseStructure
  id: BoxShelf
  name: shelf
  description: A shelf for storing boxes.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/dodgeball.ogg"
  - type: InteractionOutline
  - type: PlaceableSurface
  - type: Sprite
    sprite: Structures/Furniture/furniture.rsi
    state: rack
    snapCardinals: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 300
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: ItemSlots
    slots:
      big_slot4:
        whitelist:
          tags:
          - CardboardboxLarge
        insertOnInteract: true
        priority: 9
      big_slot3:
        whitelist:
          tags:
          - CardboardboxLarge
        insertOnInteract: true
        priority: 8
      big_slot2:
        whitelist:
          tags:
          - CardboardboxLarge
        insertOnInteract: true
        priority: 7
      big_slot1:
        whitelist:
          tags:
          - CardboardboxLarge
        insertOnInteract: true
        priority: 6
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
      big_slot4: !type:ContainerSlot { }
      big_slot3: !type:ContainerSlot { }
      big_slot2: !type:ContainerSlot { }
      big_slot1: !type:ContainerSlot { }
