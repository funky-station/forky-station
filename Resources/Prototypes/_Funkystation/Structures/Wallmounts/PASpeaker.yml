- type: entity
  parent: BaseWallmount
  id: BasePASpeaker
  name: PA speaker
  description: A PA speaker. For when you really need to know whats happening.
  abstract: true
  components:
  - type: TelecomExempt
  - type: Speech
    speechVerb: Robotic
    speechBubbleOffset: -0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4

# Construction stuff

- type: entity
  parent: BaseWallmountMetallic
  id: PASpeakerFrame
  name: PA speaker frame
  description: A husk of a PA speaker.
  suffix: Frame
  components:
  - type: Appearance
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/intercom.rsi
    layers:
    - state: base
  - type: Construction
    graph: PASPEAKER
    node: paspeakerFrame

# Speaker varieties

- type: entity
  parent: BasePASpeaker
  id: PASpeaker
  name: PA speaker
  description: A PA speaker. For when you really need to know whats happening.
  suffix: Announce only
  components:
  - type: PAAnnouncer
  - type: Appearance
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: Structures/Wallmounts/intercom.rsi
    layers:
    - state: base
    - state: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: broadcasting
      map: ["enum.RadioDeviceVisualLayers.Broadcasting"]
      shader: unshaded
      visible: false
    - state: speaker
      map: ["enum.RadioDeviceVisualLayers.Speaker"]
      shader: unshaded
      visible: false

- type: entity
  parent: PASpeaker
  id: PARadioSpeaker
  suffix: Radio, no keys
  components:
  - type: RadioSpeaker
    toggleOnInteract: false
    enabled: true
    onWhenPowered: true
    powerRequired: true
    volume: 4
  - type: EncryptionKeyHolder
    keySlots: 3
    keysExtractionMethod: Prying
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: PAKeyHolder

- type: entity
  id: PASpeakerCommon
  parent: PARadioSpeaker
  suffix: Common
  components:
  - type: RadioSpeaker
    channels:
    - Common
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon
  - type: Construction
    graph: PASPEAKER
    node: paSpeaker

