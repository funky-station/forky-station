- type: entity
  parent: BaseWallmountMachine
  id: BasePASpeaker
  name: PA speaker
  description: A PA speaker. For when you really need to know whats happening.
  abstract: true
  components:
  - type: TelecomExempt
  - type: Speech
    speechVerb: Robotic
    speechBubbleOffset: -0.5
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -4

# Construction stuff

- type: entity
  parent: BaseWallmountMetallic
  id: PASpeakerFrame
  name: PA speaker frame
  description: A husk of a PA speaker.
  suffix: Frame
  components:
  - type: Appearance
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Wallmounts/pa_speaker.rsi
    layers:
    - state: icon
    - state: unfinished
  - type: Construction
    graph: PASPEAKER
    node: paspeakerFrame
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

# end point of construction
- type: entity
  parent: PARadioSpeaker
  id: PARadioSpeakerConstructed
  categories: [ HideSpawnMenu ]
  components:
  - type: WiresPanel
    open: true

# variant with steel welded inside maintenance panel
- type: entity
  parent: PARadioSpeaker
  id: PARadioSpeakerReinforced
  abstract: true
  components:
  - type: WiresPanel
    openDelay: 5
  - type: WiresPanelSecurity
    examine: wires-panel-component-on-examine-security-level2
    wiresAccessible: false
  - type: Construction
    node: paSpeakerReinforced

# Speaker varieties

- type: entity
  parent: BasePASpeaker
  id: PASpeaker
  name: PA speaker
  description: A PA speaker. For when you really need to know whats happening. This one can't hear radio channels.
  suffix: Announce only
  components:
  - type: PAAnnouncer
  - type: Appearance
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Wallmounts/pa_speaker.rsi
    layers:
    - state: icon
    - state: icon_ON
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: PASpeaker
  id: PARadioSpeaker
  description: A PA speaker. For when you really need to know whats happening.
  suffix: Radio, no keys
  categories: [ HideSpawnMenu ]
  components:
  - type: RadioSpeaker
    toggleOnInteract: false
    enabled: true
    onWhenPowered: true
    powerRequired: true
    volume: 4
  - type: EncryptionKeyHolder
    keySlots: 3
    keysExtractionMethod: Prying
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: PAKeyHolder
  - type: Construction
    graph: PASPEAKER
    node: paSpeaker
    containers:
    - key_slots
  - type: WiresPanel
  - type: Wires
    layoutId: PASpeaker
  - type: WiresPanelSecurity
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  id: PASpeakerCommon
  parent: PARadioSpeaker
  suffix: Common
  components:
  - type: RadioSpeaker
    toggleOnInteract: false
    enabled: true
    onWhenPowered: true
    powerRequired: true
    channels:
    - Common
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyCommon

