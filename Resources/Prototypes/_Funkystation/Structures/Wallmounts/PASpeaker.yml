- type: entity
  parent: BaseWallmountMachine
  id: BasePASpeaker
  name: PA speaker
  description: A PA speaker. For when you really need to know what's happening.
  abstract: true
  components:
  - type: TelecomExempt
  - type: Speech
    speechVerb: Robotic
    speechBubbleOffset: -0.5
  - type: WiresPanel
  - type: WiresVisuals
  - type: Wires
    layoutId: PASpeaker
  - type: WiresPanelSecurity
  - type: UserInterface
    interfaces:
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface

- type: entity
  parent: BasePASpeaker
  id: PASpeaker
  name: PA speaker
  description: A very sturdy-looking PA speaker. For when you really need to know what's happening. This one can't hear radio channels.
  suffix: Announce only, indestructible
  components:
  - type: PAAnnouncer
  - type: Appearance
  - type: Sprite
    offset: 0, -0.15
    noRot: false
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Wallmounts/pa_speaker.rsi
    layers:
    - state: icon
    - state: icon_ON
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
    - state: unfinished
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisualLayers.MaintenancePanel:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false }

- type: entity
  parent: PASpeaker
  id: PARadioSpeaker
  description: A PA speaker. For when you really need to know what's happening.
  abstract: true
  components:
  - type: RadioSpeaker
    toggleOnInteract: false
    enabled: true
    onWhenPowered: true
    powerRequired: true
    volume: 4
  - type: EncryptionKeyHolder
    keySlots: 3
    keysExtractionMethod: Prying
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: PAKeyHolder

# Construction stuff

- type: entity
  parent: BaseWallmountMetallic
  id: PASpeakerFrame
  name: PA speaker frame
  description: The husk of a PA speaker.
  suffix: Frame
  components:
  - type: Appearance
  - type: Sprite
    noRot: false
    drawdepth: SmallObjects
    sprite: _Funkystation/Structures/Wallmounts/pa_speaker.rsi
    offset: 0, -0.15
    layers:
    - state: icon
    - state: unfinished
  - type: Construction
    graph: PASPEAKER
    node: paspeakerFrame
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 1
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic

# end point of construction
- type: entity
  parent: PARadioSpeakerDestructible
  id: PARadioSpeakerConstructed
  categories: [ HideSpawnMenu ]
  components:
  - type: WiresPanel
    open: true

# variant with steel welded inside maintenance panel
- type: entity
  parent: PARadioSpeaker # parent off of PARadioSpeaker instead of PARadioSpeakerDestructible because of how destructible inheritance works
  id: PARadioSpeakerDestructibleReinforced
  description: A sturdy-looking PA speaker. For when you really need to know what's happening.
  abstract: true
  components:
  - type: WiresPanel
    openDelay: 5
  - type: WiresPanelSecurity
    examine: wires-panel-component-on-examine-security-level2
    wiresAccessible: false
  - type: Construction
    graph: PASPEAKER
    node: paSpeakerReinforced
    containers:
    - key_slots
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100 # a little bit tankier than normal
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - key_slots
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: paspeakerFrame
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic

# destructible nonsense just so that reinforced speakers can be sturdier than normal
- type: entity
  parent: PARadioSpeaker
  id: PARadioSpeakerDestructible
  suffix: Radio, no keys
  components:
  - type: Construction
    graph: PASPEAKER
    node: paSpeaker
    containers:
    - key_slots
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:EmptyContainersBehaviour
        containers:
        - key_slots
      - !type:DoActsBehavior
        acts: [ "Breakage" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: paspeakerFrame
  - type: Damageable
  - type: Injurable
    damageContainer: StructuralInorganic

