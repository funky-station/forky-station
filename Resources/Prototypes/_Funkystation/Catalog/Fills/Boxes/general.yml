- type: entity
  parent: SlideboxBase
  id: SlideboxCardboard
  name: cardboard slidebox
  description: A long cardboard box with a sliding insert.
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
  - type: Sprite
    state: box
  - type: Tag
    tags:
    - BoxCardboard

- type: entity
  name: inflatable wall slidebox
  parent: SlideboxCardboard
  id: SlideboxInflatableWall
  description: A sleeve of self-inflating walls and doors. Highly compact and great for 'temporary' fixes.
  components:
  - type: StorageFill
    contents:
    - id: FunkyInflatableWallStack
      amount: 3
    - id: FunkyInflatableDoorStack
  - type: Sprite
    layers:
      - state: icon
      - state: icon_open
        map: ["openLayer"]
      - state: stripe_inflatables
      - state: inflatable_wall

- type: entity
  name: inflatable floor slidebox
  parent: SlideboxCardboard
  id: SlideboxInflatableFloor
  description: Some squeaky floor tiles best used for sealing up emergency spacings.
  components:
  - type: StorageFill
    contents:
    - id: FunkyInflatableFloorStack
      amount: 4
  - type: Sprite
    layers:
      - state: icon
      - state: icon_open
        map: ["openLayer"]
      - state: stripe_inflatables
      - state: inflatable_floor
