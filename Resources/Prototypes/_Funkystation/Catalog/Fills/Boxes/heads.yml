# Deputy head packages

- type: entity
  parent: BoxCardboard
  id: FunkyBoxDQM
  name: deputy quartermaster package
  suffix: dQM
  components:
  - type: Sprite
    layers:
      - state: box
      - state: dqm
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FunkyClothingNeckBadgeDQM
        - id: FunkyKeyDQM
        - id: FunkyDQMPDA
        - id: Whistle
        - id: Magic9Ball
        - id: FoodSnackChocolate # TODO: Make this some slightly nicer chocolates. Supermarket gourmet shit

