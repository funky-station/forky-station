# Deputy head packages

- type: entity
  parent: BoxCardboard
  id: FuBoxDqm
  name: deputy quartermaster package
  suffix: dQM
  components:
  - type: Sprite
    layers:
      - state: box
      - state: dqm
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FuClothingNeckBadgeDqm
        - id: FuKeyDqm
        - id: FuDqmPDA
        - id: Whistle
        - id: Magic9Ball
        - id: FoodSnackChocolate # TODO: Make this some slightly nicer chocolates. Supermarket gourmet shit

