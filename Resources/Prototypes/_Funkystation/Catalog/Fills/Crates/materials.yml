- type: entity
  id: CrateMaterialGlassBulk
  parent: CrateGenericSteel
  name: bulk glass sheet crate
  description: 270 sheets of glass, packed with extreme care.
  components:
  - type: StorageFill
    contents:
      - id: SheetGlass
        amount: 9

- type: entity
  id: CrateMaterialSteelBulk
  parent: CrateGenericSteel
  name: bulk steel sheet crate
  description: 270 sheets of steel.
  components:
  - type: StorageFill
    contents:
      - id: SheetSteel
        amount: 9

- type: entity
  id: CrateMaterialPlasticBulk
  parent: CrateGenericSteel
  name: bulk plastic sheet crate
  description: 270 sheets of plastic.
  components:
  - type: StorageFill
    contents:
      - id: SheetPlastic
        amount: 9

- type: entity
  id: CrateMaterialPlasmaBulk
  parent: CratePlasma
  name: bulk solid plasma crate
  description: 90 sheets of plasma.
  components:
  - type: StorageFill
    contents:
      - id: SheetPlasma
        amount: 3

- type: entity
  id: CrateMaterialUranium 
  parent: CratePlasma 
  name: uranium sheet crate
  description: 30 sheets of uranium.
  components:
  - type: StorageFill
    contents:
      - id: SheetUranium

- type: entity
  parent: CrateGenericSteel
  id: CrateMaterialBasicResourceBulk 
  name: bulk basic sheet crate
  description: 90 sheets of steel, glass, and plastic.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SheetSteel
          amount: 3
        - id: SheetGlass
          amount: 3
        - id: SheetPlastic   
          amount: 3 