- type: entity
  name: Thematic Maint Locker Spawner
  id: ClosetMaintenanceThematic
  parent: MarkerBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Funkystation/Structures/Storage/closet.rsi # Funky
      state: rainbow_locker
