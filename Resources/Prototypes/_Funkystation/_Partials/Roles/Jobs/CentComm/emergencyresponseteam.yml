# Leader
- type: job
  id: ERTLeader
  special: !Clear
  - !type:AddImplantSpecial
    implants: [ DeathRattleImplantCentcomm ]

- type: startingGear
  id: ERTLeaderGearEVA
  equipment:
    shoes: ClothingShoesBootsMagERTAdvancedFilled
    suitstorage: !Remove
  storage:
    back:
    - Truncheon
    belt:
    - !Remove Stunbaton

- type: startingGear
  id: ERTLeaderGearArmed
  equipment:
    shoes: ClothingShoesBootsMagERTAdvancedFilled
    pocket2: !Remove

