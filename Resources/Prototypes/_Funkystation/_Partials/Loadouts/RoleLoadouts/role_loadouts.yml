# Clearing and rewriting every single one of these for two reasons
# 1. Doing it the other way is horrible and tedious
# 2. These should be reorganized later down the line anyway, which would necessitate redoing them all anyway
# The only downside is that changes upstream will not be reflected and will have to be added manually here
# Make sure to comment those changes if they come from Macrocosm, with "# MACRO"

- type: roleLoadout
  id: JobCaptain
  groups: !Clear
  - CaptainHead
  - CaptainNeck
  - CaptainJumpsuit
  - CaptainOuterClothing
  - FunkyPager
  - AssistiveItems
  - Survival
  - Trinkets
  - CaptainJobTrinkets
  - GroupSpeciesBreathTool
  - GroupBreathToolDecapoid # MACRO: Decapoid

