# Chief Medical Officer

- type: loadoutGroup
  id: ChiefMedicalOfficerHead
  minLimit: 0
  loadouts: !Clear
  - FunkyMedicalScrubcapTeal
  - FunkyMedicalFaceshield

- type: loadoutGroup
  id: ChiefMedicalOfficerJumpsuit
  name: funky-loadout-group-cmo-uniform
  loadouts: !Clear
  - FunkyMedicalScrubsTeal
  - FunkyMedicalScrubsTealSleeveless
  - FunkyCMODress
  - FunkyCMODressStockings
  - FunkyCMOJumpsuit

- type: loadoutGroup
  id: ChiefMedicalOfficerOuterClothing
  minLimit: 0
  loadouts: !Clear
  - FunkyCMOLabcoat
  - FunkyCMOWinterLabcoat

# Unused job trinket loadoutGroups go here on the off chance that upstream uncomments and uses them
# If that happens, partial prototypes will automagically combine them!
# Otherwise, since they aren't !partialOnly, they will be read as normal prototypes, hence them still having names
- type: loadoutGroup
  id: ChiefMedicalOfficerJobTrinkets
  name: loadout-group-jobtrinkets
  minLimit: 0
  loadouts:
  - FunkyCommandWhistle

