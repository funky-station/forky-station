#Mob Spawners

- type: entity
  id: XenoArtifactEffectSpaceTimeParadoxSpawn
  parent: BaseOneTimeXenoArtifactEffect
  description: Metaphysical disturbance
  components:
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:AllSelector
        children:
        - id: MobParadoxArtifact
        - id: EffectEmpPulse

- type: entity
  id: XenoArtifactEffectGooseSpawn
  parent: BaseXenoArtifactEffect
  description: Spontaneous organic creation
  components:
  - type: XenoArtifactNode
    maxDurability: 3
    maxDurabilityCanDecreaseBy:
      min: 0
      max: 2
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:GroupSelector
        children:
        - id: MobGoose
          weight: 100.0
        - id: MobGooseGolden
          weight: 20.0
        - id: MobGooseUranium
          weight: 20.0
        - id: MobGoosePlasma
          weight: 20.0
        - id: GooseRune_drawing
          weight: 1.0
          amount: !type:ConstantNumberSelector
            value: 2

- type: entity
  id: XenoArtifactEffectSkeletonGhostRoleSpawn
  parent: BaseOneTimeXenoArtifactEffect
  description: Spontaneous inorganic creation
  components:
  - type: XenoArtifactNode
    depth: 2
    durability: 1
  - type: XAEApplyComponents
    applyIfAlreadyHave: true
    refreshOnReactivate: true
    components:
    - type: EntityTableSpawner
      deleteSpawnerAfterSpawn: false
      table: !type:GroupSelector
        children:
        - id: MobSkeletonArtifact
          weight: 5
        - id: MobSkeletonPirate
          weight: 1
        - id: MobSkeletonBiker
          weight: 1

- type: entity
  id: XenoArtifactButterflySpawn
