# https://github.com/space-wizards/space-station-14/pull/41664
# Decapoid

- type: entity
  parent: BoxSurvival
  id: BoxSurvivalAquatic
  suffix: Standard H2O
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
  - type: Sprite
    sprite: _Funkystation/Objects/Storage/boxes.rsi # Funky
    layers:
    - state: internals
    - state: vaportank
  - type: Label
    localizedLabel: emergency-box-aquatic-label

- type: entity
  parent: BoxSurvivalAquatic
  id: BoxSurvivalEngineeringAquatic
  suffix: Extended, H2O
  name: extended-capacity survival box
  description: It's a box with basic internals inside. This one is labelled to contain an extended-capacity water bottle.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
  - type: Sprite
    sprite: _Funkystation/Objects/Storage/boxes.rsi # Funky
    layers:
    - state: internals
    - state: extendedtankvapor

- type: entity
  parent: BoxSurvivalAquatic
  id: BoxHugAquatic
  name: box of hugs
  suffix: Emergency H2O
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Storage/boxes.rsi # Funky
    layers:
    - state: box_hug
    - state: heart
  - type: Item
    heldPrefix: hug
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: PillEmergency
  - type: Tag
    tags:
    - BoxHug

