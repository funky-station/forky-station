- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 600
    blue:
      announcement: alert-level-blue-announcement
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound: /Audio/Misc/bluealert.ogg
        monoSound: /Audio/Misc/bluealert_mono.ogg # funky - mono for PA sound effects
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound: /Audio/Misc/notice1.ogg
        monoSound: /Audio/Misc/notice1_mono.ogg # funky - mono for PA sound effects
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound: /Audio/Misc/notice1.ogg
        monoSound: /Audio/Misc/notice1_mono.ogg # funky - mono for PA sound effects
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound: /Audio/Misc/redalert.ogg
        monoSound: /Audio/Misc/redalert_mono.ogg # funky - mono for PA sound effects
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound:
          path: /Audio/Misc/gamma.ogg
          params:
            volume: -2
        monoSound:
          path: /Audio/Misc/gamma_mono.ogg # funky - mono for PA sound effects
          params:
            volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound: # funky - switch to mono sounds when using PA announcements
        stereoSound:
          path: /Audio/Misc/delta.ogg
          params:
            volume: -3
        monoSound:
          path: /Audio/Misc/delta_mono.ogg # funky - mono for PA sound effects
          params:
            volume: -3
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound:
        stereoSound:
          path: /Audio/Misc/epsilon.ogg
          params:
            volume: -2
        monoSound:
          path: /Audio/Misc/epsilon_mono.ogg # funky - mono for PA sound effects
          params:
            volume: -2
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
