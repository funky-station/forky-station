  supervisors: job-supervisors-captain
  access:
  - Cargo
  - Hydroponics # Funky - Botanist is now in Logistics
  - Salvage
  - Quartermaster
  - Maintenance
  - External
  - Command
  - Brig
  - Cryogenics
  special:
