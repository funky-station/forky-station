- type: entity
  name: Celedon
  parent: MobBaseAncestor
  id: MobCeledonRaptor
  description: Before the genetics lab on Europa was shut down, an activist group fought to save the animals about to be euthanized. Celedon is still untrusting of most humanoids, but maybe they can be rehabilitated.
  components:
  # Code for Celedon is copied from LaserRaptor, Pun pun, Remilia, Willow, and Impstation's dinosaurs
  - type: Sprite
    drawdepth: Mobs
    sprite: Mobs/Pets/celedon.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: celedon_raptor
    - map: ["enum.HumanoidVisualLayers.Handcuffs"] #this is temporary because it keeps throwing up errors when thinking about handcuffs
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 80
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: celedon_raptor
      Dead:
        Base: celedon_raptor_dead
  - type: Tool
    qualities:
    - Prying
  # Celedon is intended to pry open doors, this speed could be lowered if found too fast
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.0
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ReplacementAccent
    accent: celedon
  - type: MeleeWeapon
    animation: WeaponArcClaw
    wideAnimation: WeaponArcClaw
    altDisarm: false
    angle: 30
    soundHit:
      collection: AlienClaw
    # Damage lowered from 20 to 15 as I increased the attack speed to 1.0 as .33 felt too slow, Structural decreased from 12 to 10
    damage:
      types:
        Slash: 15
        Structural: 10
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Hands
  - type: ComplexInteraction
  - type: Cuffable # Need to figure out sprite layer
  - type: Stripping
  - type: Puller
    needsHands: false
  - type: Blindable
  - type: NPCRetaliation
    attackMemoryLength: 10
  - type: TypingIndicator
    proto: lizard
  - type: MindContainer
  - type: Inventory
    speciesId: kangaroo
    templateId: raptorinventory
  - type: InventorySlots
  - type: Temperature
  - type: TemperatureSpeed
    thresholds:
      301: 0.8
      295: 0.6
      285: 0.4
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.50
        Heat: 0.1
  - type: PassiveDamage # Slight passive regen. Assuming one damage type, comes out to about 4 damage a minute.
    allowedStates:
    - Alive
    damage:
      types:
        Heat: -0.07
  - type: Metabolizer
    solutionOnBody: false
    metabolizerTypes: [ Animal ]
  - type: Dna

  - type: Speech
    speechSounds: Lizard
    speechVerb: Vox
    allowedEmotes: ['Thump']
  - type: Vocal
    emoteSounds: Celedon
  - type: BodyEmotes
    soundsId: GeneralBodyEmotes
  - type: Damageable
  - type: GhostRole
    prob: 1
    makeSentient: true
    allowSpeech: true
    allowMovement: true
    name: ghost-role-information-celedon-name
    description: ghost-role-information-celedon-description
    rules: ghost-role-information-freeagent-rules
  - type: GhostTakeoverAvailable
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 4
    - id: MaterialBones1
      amount: 4
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener
    - AnomalyHost
    - FootstepSound
    - CanPilot
  - type: Grammar
    attributes:
      proper: true
      gender: epicene
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 5.25
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BarestepHard
  - type: NpcFactionMember
    factions:
    - PetsNT
    - Passive
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: Alerts
  - type: Familiar
  - type: InteractionPopup
    successChance: 0.5
    interactSuccessString: petting-success-reptile
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/lizard_happy.ogg
  - type: MobPrice
    price: 751 # Celedon shouldn't have a price as they are a priceless team-member