- type: entity
  name: civilian
  parent: MobHuman
  id: MobCivilian
  description: A miserable pile of secrets.
  components:
  - type: InputMover
  - type: MobMover
  - type: Loadout
    prototypes: [LimitedPassengerGear]
  - type: NpcFactionMember
    factions:
    - NanoTrasen

- type: entity
  name: salvager
  parent: MobHuman
  id: MobSalvager
  components:
    - type: NpcFactionMember
      factions:
        - Syndicate
    - type: Loadout
      prototypes:
        - SalvageSpecialistGear
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound

- type: entity
  name: spirate
  parent: MobHuman
