- type: entity
  parent: MobHuman
  suffix: Dead
  save: false # mobs are currently not saveable.
  id: SalvageHumanCorpse
  name: unidentified corpse
  description: I think they're dead.
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Damageable
    damage:
      types:
        Bloodloss: 49
        Asphyxiation: 76
        Slash: 56
        Blunt: 19
  - type: Inventory
    templateId: corpse

- type: entity
  parent: MobHuman
  id: MobCluwne
  name: person
  description: A polymorphed unfortunate.
  components:
  - type: Cluwne
  - type: Speech
    speechVerb: Cluwne
