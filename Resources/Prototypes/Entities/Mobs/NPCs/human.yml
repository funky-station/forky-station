#funky start
- type: entity
  name: mercenary grunt
  parent: MobHuman
  id: MobMercenaryGrunt
  description: Get some!
  components:
  - type: NpcFactionMember
    factions:
      - Syndicate
  - type: Loadout
    prototypes:
      - MercGruntGear
  - type: InputMover
  - type: MobMover
  - type: HTN
    rootTask:
      task: SimpleHumanoidHostileCompound
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-mercenary-grunt-name
    description: ghost-role-information-mercenary-grunt-description
    rules: ghost-role-information-mercenary-grunt-rules
    raffle:
      settings: default
  - type: GhostTakeoverAvailable

