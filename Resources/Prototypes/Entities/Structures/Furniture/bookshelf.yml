- type: entity
  parent: [ BaseStructure, StructureHealthFurniture ]
  id: Bookshelf
  name: "bookshelf"
  description: Mostly filled with books.
  components:
  - type: Sprite
    sprite: Structures/Furniture/bookshelf.rsi
    snapCardinals: true
    layers:
      - state: base
      - state: book-0
      - map: ["enum.StorageFillLayers.Fill"]
      - state: paper #Funky changes start
        sprite: Structures/Furniture/bookshelf.rsi
        map: [ "enum.PaperLabelVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.PaperLabelVisuals.HasLabel:
        enum.PaperLabelVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.PaperLabelVisuals.LabelType:
        enum.PaperLabelVisuals.Layer:
          Paper: { state: paper }
          PaperOrange: { state: PaperOrange }
          PaperYellow: { state: PaperYellow }
          PaperGreen: { state: PaperGreen }
          PaperRed: { state: PaperRed }
          PaperPurple: { state: PaperPurple }
          PaperBlue: { state: PaperBlue }
          PaperBrown: { state: PaperBrown } #funky changes end
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 21
    fillBaseName: book
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 3
  - type: Tag
    tags:
    - Structure
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Pullable
  - type: Occluder
  - type: Storage #funky changes start
    grid:
    - 0,0,6,1
    - 0,3,6,4
    - 0,6,6,7 #funky changes end
    maxItemSize: Normal
    whitelist:
      tags:
        - Document
        - Folder
        - Write
        - Book
        - Spellbook
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
      paper_label: !type:ContainerSlot #funky change
  - type: Construction
    graph: Bookshelf
    node: bookshelf
  - type: BlockWeather
  - type: ItemSlots
  - type: PaperLabel #funky changes start
    labelSlot:
      insertVerbText: comp-paper-label-insert
      ejectVerbText: comp-paper-label-eject
      whitelist:
        components:
        - Paper
      blacklist:
        tags:
        - Book #funky changes end
