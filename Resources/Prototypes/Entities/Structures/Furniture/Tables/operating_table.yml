- type: entity
  id: OperatingTable
  parent: Bed
  name: operating table
  description: Special medical table for surgery. This one just seems to be a useless prop, though.
  components:
  - type: Sprite
    sprite: Structures/Furniture/Tables/optable.rsi
    noRot: true
    layers:
      - state: operating_table
        map: ["enum.OperatingTableVisualLayers.Base"]
      - state: vitals_1
        map: ["enum.OperatingTableVisualLayers.Vitals"]
        visible: false
      - map: ["tank"]
  - type: Icon
    sprite: Structures/Furniture/Tables/optable.rsi
    state: operating_table
  - type: AmbientMusicMarkerMedical
  - type: Appearance
  - type: PlaceableSurface
    isPlaceable: false
  - type: PointLight
    enabled: false
    radius: 6
    energy: 3
    color: "#FFFFFF"
    castShadows: false
    netsync: true
  - type: OperatingTableLight
  - type: OperatingTableVisuals
  - type: GenericVisualizer
    visuals:
      enum.BedInternalsVisuals.TankVisual:
        tank:
          None:      { visible: false }
          Nitrogen:  { state: tank_1, visible: true }
          Oxygen:    { state: tank_2, visible: true }
          Generic:   { state: tank_3, visible: true }
          Plasma:    { state: tank_4, visible: true }
          Nitrous:   { state: tank_5, visible: true }
  - type: ContainerContainer
    containers:
      gasTankSlot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      gasTankSlot:
        name: comp-gas-canister-slot-name-gas-tank
        whitelist:
          components:
            - GasTank
        insertOnInteract: true
  - type: BedInternals
    slot: gasTankSlot
    maskPrototype: ClothingMaskBreathMedicalBed
