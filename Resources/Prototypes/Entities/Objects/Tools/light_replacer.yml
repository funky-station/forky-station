- type: entity
  parent: BaseItem
  name: light replacer
  id: LightReplacer
  description: An item which uses magnets to easily replace broken lights. Refill by adding more lights into the replacer.
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # Funky
    state: icon
  - type: Item
    sprite: _Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # Funky
  - type: LightReplacer
  - type: EntityProvider
    whitelist:
      components:
      - LightBulb
  - type: ContainerContainer
    containers:
      entity-provider: !type:Container
  - type: StaticPrice
    price: 100
  - type: UserInterface
    interfaces:
      enum.LightReplacerUiKey.Key:
        type: LightReplacerMenuBoundUserInterface
  - type: Tag
    tags:
    - LightReplacer

- type: entity
  parent: LightReplacer
  id: LightReplacerFilled
  suffix: Filled
  components:
  - type: EntityProvider
    entityCounter:
      LightTube: 8
      LightBulb: 5

# The following entities are solely used for sprites in the radial menu.
- type: entity
  id: EjectTubes
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # Funky
    state: eject-tubes

- type: entity
  id: EjectBulbs
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Specific/Janitorial/light_replacer.rsi # Funky
    state: eject-bulbs
