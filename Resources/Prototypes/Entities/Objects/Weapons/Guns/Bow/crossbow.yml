- type: entity
  parent: BaseItem
  name: crossbow
  id: BaseCrossbow
  description: The second rooty tooty point and shooty.
  # reference to the bow description, mostly a placeholder until
  # I can think of something better
  abstract: true
  components: #TODO: add a system for drawing the crossbow before being able to fire it
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/crossbow.rsi # TEMPORARY
  - type: Item
    size: Large
  - type: Wieldable
  - type: UseDelay
    delay: 2.5 # until a drawing system can be implemented
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 2
    fireRate: 1
    projectileSpeed: 35 # base for now, here for reference as a reminder
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg #close enough for now
        whitelist:
          tags:
          - Bolt
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles

- type: entity
  parent: BaseCrossbow
  abstract: true
  id: BaseCrossbowCompound
  name: compound crossbow
  components:
  - type: Sprite #currently colours are just the regions of the crossbow
    sprite: Objects/Weapons/Guns/Bow/compound-crossbow.rsi # ignore the 64x one
    layers:
    - state: undrawn
      map: [ base ]
    - state: drawn-bolt
      map: [ bolt ]
      visible: false
    - type: Appearance
    - type: ItemMapper
      spriteLayers:
      - bolt
      mapLayers:
        bolt:
          whitelist:
            tags:
            - Bolt
    - type: BreechLoaded
      ToggleDelay: 3
      openSound: # temporary sound
        path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
      closeSound:
        path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
    - type: GenericVisualizer
      visuals:
        enum.BreechVisuals.Open:
          enum.BreechVisuals.Open:
            True: { state: undrawn}
            False: { state: drawn }


- type: entity
  parent: [ BaseCrossbowCompound, BaseSecurityContraband]
  id: CrossbowSecurity
  name: AGIES security crossbow
  description: "With the all new AGIES Security crossbow you don't have to worry about silly things like trigger discipline, because crossbows are obviously less dangerous then a gun! (Disclaimer: AGIES Security is not responsible for any injuries this causes)"
  #components: # TODO: finish it's own sprite

- type: entity
  parent: [ BaseCrossbowCompound, BaseSyndicateContraband ]
  id: SyndicateCrossbow
  name: syndicate crossbow
  description: A crossbow manufactured by the Syndicate.

- type: entity
  parent: BaseCrossbow
  id: CrossbowImprovised
  name: improvised crossbow
  components:
  - type: Gun
    projectileSpeed: 20 # not as strong
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/crossbow.rsi # TEMPORARY
    layers:
    - state: undrawn
      map: [ base ]
    - state: drawn-bolt
      map: [ bolt ]
      visible: false
  - type: Appearance
  - type: ItemMapper
    spriteLayers:
    - bolt
    mapLayers:
      bolt:
        whitelist:
          tags:
          - Arrow
          - Bolt
  - type: BreechLoaded
    ToggleDelay: 3
    openSound: # temporary sound
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
    closeSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
  - type: GenericVisualizer
    visuals:
      enum.BreechVisuals.Open:
        enum.BreechVisuals.Open:
          True: { state: undrawn}
          False: { state: drawn }
