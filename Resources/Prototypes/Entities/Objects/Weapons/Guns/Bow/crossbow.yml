- type: entity
  parent: BaseItem
  name: crossbow
  id: BaseCrossbow
  description: The second rooty tooty point and shooty.
  # reference to the bow description, mostly a placeholder until
  # I can think of something better
  abstract: true
  components: #TODO: add a system for drawing the crossbow before being able to fire it
  - type: Sprite
    sprite: Objects/Weapons/Guns/Bow/crossbow.rsi # TEMPORARY
  - type: Item
    size: Large
  - type: Wieldable
  - type: UseDelay
    delay: 2.5 # until a drawing system can be implemented
  - type: GunRequiresWield
  - type: Gun
    minAngle: 0
    maxAngle: 2
    fireRate: 1
    projectileSpeed: 35 # base for now, here for reference as a reminder
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: BulletMiss
    soundEmpty: null
  - type: ItemSlots
    slots:
      projectiles:
        name: Projectiles
        startingItem: null
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg #close enough for now
        whitelist:
          tags:
          - Bolt
          - Arrow #for testing TODO: remove once it is done
  - type: ContainerContainer
    containers:
      projectiles: !type:ContainerSlot
  - type: ContainerAmmoProvider
    container: projectiles

- type: entity
  parent: BaseCrossbow
  abstract: true
  id: BaseCrossbowCompound
  name: compound crossbow
  components:
  - type: Sprite #currently colours are just the regions of the crossbow
    sprite: Objects/Weapons/Guns/Bow/compound-crossbow.rsi # ignore the 64x one
    layers:
    - state: undrawn
      map: [ base ]
    - state: drawn-bolt
      map: [ bolt ]
      visible: false
    - type: Appearance
    - type: ItemMapper
      spriteLayers:
      - bolt
      mapLayers:
        bolt:
          whitelist:
            tags:
            - Arrow
            - Bolt
    - type: GenericVisualizer
      visuals:
        enum.WieldableVisuals.Wielded:
          bolt:
            True: { state: drawn-bolt }
            False: { state: drawn-bolt }
          base:
            True: { state: drawn }
            False: { state: undrawn }

