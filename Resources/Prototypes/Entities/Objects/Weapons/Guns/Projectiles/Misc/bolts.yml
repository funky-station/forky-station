- type: entity
  abstract: true
  parent: [ BaseItem ] # no Solution Dart because that isn't for every bolt
  id: BaseBolt
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/bolts.rsi #Sprites are not done and are pretty much just the arrow sprites
  - type: Item
    size: Small
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.2
        density: 5
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      projectile:
        shape:
          !type:PhysShapeAabb # no idea what this is for but it's in the arrow so I'm putting it here so I don't crash the game
          bounds: "-0.1,-0.3,0.2,-0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: ThrowingAngle
    angle: 0
  - type: Ammo
    muzzleFlash: null
  - type: Tag
    tags:
    - Bolt
    - Arrow # FOR TESTING ONLY, TODO: REMOVE ONCE IT IS DONE
  - type: Projectile
    deleteOnCollide: false
    onlyCollideWhenShot: true
    damage:
      types:
        Piercing: 35
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    embedOnThrow: false

- type: entity
  parent: [ BaseBolt, BaseSecurityContraband ]
  id: BoltLessLethal
  name: rubber bolt
  description: A bolt with a rounder rubber tip. It still hurts though.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-rounded
      color: black
  - type: Projectile # tried to make it so it doesn't embed into people and either pierces or just bounces and drops onto the ground, failed
    PenetrationThreshold: 100
    PenetrationDamageTypeRequirement:
    - Blunt
    damage:
      types:
        Blunt: 25 # Still lethal
  - type: StunOnCollide
    slowdownAmount: 2
    walkSpeedModifier: 0.75
    sprintSpeedModifier: 0.75
  - type: StaminaDamageOnCollide
    damage: 35

- type: entity
  parent: [ BaseBolt, BaseSecurityContraband ]
  id: BoltLethal
  name: crossbow bolt
  description: A crossbow bolt with a sharp tip.
  components:
  - type: Sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-pointed
      color: gray

- type: entity
  parent: [ BaseBolt, BaseSyndicateContraband ]
  id: HeavyBolt
  name: reinforced bolt
  description: A crossbow bolt reinforced with plastinium to be shot with much more power.
  components:
  - type: Sprite # Should probably give it a different sprite but this is fine for now
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-pointed
      color: gray
  - type: Tag
    tags:
    - BoltHeavy
  - type: Projectile
    PenetrationThreshold: 200
    PenetrationDamageTypeRequirement:
    - Piercing
    PenetrationAmount: 0
    damage:
      types:
        Piercing: 45

- type: entity
  parent: [ BaseBolt, BaseSyndicateContraband ]
  id: VeryHeavyBolt
  name: ballista bolt
  description: A ballista bolt bearing the syndicate logo
  components:
  - type: Tag
    tags:
      - BoltVeryHeavy
      - Spear
      - ScurretWearable
  - type: Projectile
    damage:
      types:
        Piercing: 50
        Blunt: 25
  # rest is it working as a spear as well
  - type: Tool
    qualities:
    - Slicing
  - type: EmbeddableProjectile
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 225
  - type: LandAtCursor
  - type: Tag
    tags:
    - Spear
    - ScurretWearable
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.40,-0.30
          - -0.30,-0.40
          - 0.40,0.30
          - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: Objects/Weapons/Melee/spear.rsi
    layers:
    - state: spear
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Piercing: 12
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 15
  - type: Item
    size: Ginormous
    shape:
    - 0,0,0,6
    storedRotation: -45
  - type: Clothing
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Piercing: 4


  # Misc bolts
- type: entity
  parent: BaseBolt
  id: BoltImprovised
  name: improvised bolt
  description: The sophisticated greyshirt's preferred projectile # I had a typo of "greyshit" and am tempted to keep it in
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 25
  - type: Sprite
    layers: #TEMPORARY, same as the improvised arrow
    - state: tail
      color: white
    - state: rod
      color: darkgray
    - state: tip-pointed
      color: lightblue
  - type: DamageOnLand
    damage:
      types:
        Blunt: 10 # should be 3 uses before breaking if this works right

# Bolts that don't work right :(
- type: entity
  parent: [BaseBolt, BaseSecurityContraband]
  id: BoltBola # currently does not work as ensnaring only works when thrown
  # TODO: make ensnaring work when shot as well
  name: bola bolt
  description: With the all new BolaBolt (TM) you can be sure they cannot escape!
  components:
  - type: Sprite
    layers:
    - state: tail
      color: black
    - state: rod
      color: darkgray
    - state: tip-bola #not done yet, currently just the rounded tip
      color: red
  - type: Projectile
    deleteOnCollide: true
    damage:
      types:
        Blunt: 15 # still hurts
  - type: DamageOnLand
    damage:
      types:
        Blunt: 15
  - type: Ensnaring # should be stronger than the throwable ones
    freeTime: 2.5 # others freeing the person
    breakoutTime: 4.5
    walkSpeed: 0.5
    sprintSpeed: 0.5
    staminaDamage: 0
    canThrowTrigger: false
    canMoveBreakout: true
    maxEnsnares: 1

