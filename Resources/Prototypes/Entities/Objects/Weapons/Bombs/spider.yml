- type: entity
  name: spider clan charge
  description: A modified C-4 charge supplied to you by the Spider Clan. Its explosive power has been juiced up, but only works in one specific area.
  # not actually modified C-4! oh the horror!
  parent: [ BaseItem, BaseHighlyIllegalContraband ]
  id: SpiderCharge
  components:
  - type: Sprite
    sprite: Objects/Weapons/Bombs/spidercharge.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Bombs/spidercharge.rsi
    size: Small
  - type: SpiderCharge
  - type: TriggerOnStuck
  - type: TimerTrigger
    delay: 90 # funky change from 10
    delayOptions: [90, 120, 180, 240] # funky change from [5, 10, 30, 60]
    initialBeepDelay: 30 # funky change from 0
    beepSound: /Audio/Machines/Nuke/general_beep.ogg
  - type: Sticky
    stickDelay: 3 # funky change from 5
    unstickDelay: 6 #funky
    stickPopupStart: comp-sticky-start-stick-bomb
    stickPopupSuccess: comp-sticky-success-stick-bomb
    #funky unstick popups
    unstickPopupStart: comp-sticky-start-unstick-bomb
    unstickPopupSuccess: comp-sticky-success-unstick-bomb
    # unsticking defuses the bomb
    canUnstick: true # funky change from false
    whitelist:
      components:
      - Wall
      tags:
      - Window
  - type: Explosive # Powerful explosion in a large radius. Will break underplating.
    explosionType: DemolitionCharge
    totalIntensity: 600 # funky change from 360
    intensitySlope: 15 # funky change from 10
    maxIntensity: 400 # funky change from 120
    canCreateVacuum: true
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: StickyVisualizer
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        base:
          Primed: { state: primed }
          Unprimed: { state: icon }
