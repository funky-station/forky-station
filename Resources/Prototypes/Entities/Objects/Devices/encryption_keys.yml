- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: encryption key
  description: A small cypher chip for headsets.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: _Funkystation/Objects/Devices/encryption_keys.rsi #funkystation
  - type: Sprite
    sprite: _Funkystation/Objects/Devices/encryption_keys.rsi #funkystation

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: common encryption key
  description: An encryption key used by anyone.
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: default #funkystation
    - state: label-common #funkystation
  - type: Tag
    tags:
    - EncryptionCommon

- type: entity
