- type: entity
  name: generic rubber stamp
  parent: BaseItem
  id: RubberStampBase
  description: A rubber stamp for stamping important documents.
  abstract: true
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-default
    stampState: "paper_stamp-generic"
    stampedColor: "#a23e3e"
    sound:
      path: /Audio/Items/Stamp/automatic_stamp.ogg # Funky
      params:
        volume: -2
        maxDistance: 5
  - type: Sprite
    sprite: _Funkystation/Objects/Misc/stamps.rsi # Funky
    state: stamp-mime
  - type: Item
    size: Tiny
    inhandVisuals:
      left:
      - state: stamp-inhand-left
      - state: handle-inhand-left
        color: "#f8f8f8"
      right:
      - state: stamp-inhand-right
      - state: handle-inhand-right
        color: "#f8f8f8"
  - type: StealTarget
    stealGroup: Stamp

