- type: entityTable
  id: PackageRareDepartmentBundlesTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: PackageRareMedicalBundlesTable
    - !type:NestedSelector
      tableId: PackageRareEngineeringBundlesTable
