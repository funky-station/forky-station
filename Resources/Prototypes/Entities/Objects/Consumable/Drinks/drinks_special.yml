        priority: 6
      6pack_slot5:
        ejectOnUse: true
        startingItem: DrinkColaCan
        whitelist:
          tags:
          - DrinkCan
        priority: 5
      6pack_slot4:
        ejectOnUse: true
        startingItem: DrinkColaCan
        whitelist:
          tags:
          - DrinkCan
        priority: 4
      6pack_slot3:
        ejectOnUse: true
        startingItem: DrinkColaCan
        whitelist:
          tags:
          - DrinkCan
        priority: 3
      6pack_slot2:
        ejectOnUse: true
        startingItem: DrinkColaCan
        whitelist:
          tags:
          - DrinkCan
        priority: 2
      6pack_slot1:
        ejectOnUse: true
        startingItem: DrinkColaCan
        whitelist:
          tags:
          - DrinkCan
        priority: 1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
      6pack_slot6: !type:ContainerSlot { }
      6pack_slot5: !type:ContainerSlot { }
      6pack_slot4: !type:ContainerSlot { }
      6pack_slot3: !type:ContainerSlot { }
      6pack_slot2: !type:ContainerSlot { }
      6pack_slot1: !type:ContainerSlot { }
  - type: ItemMapper
    mapLayers:
      6pack1:
        minCount: 1
        whitelist:
          tags:
          - DrinkCan
      6pack2:
        minCount: 2
        whitelist:
          tags:
          - DrinkCan
      6pack3:
        minCount: 3
        whitelist:
          tags:
          - DrinkCan
      6pack4:
        minCount: 4
        whitelist:
          tags:
          - DrinkCan
      6pack5:
        minCount: 5
        whitelist:
          tags:
          - DrinkCan
      6pack6:
        minCount: 6
        whitelist:
          tags:
          - DrinkCan
    sprite: Objects/Misc/6pack.rsi # funky change end

# Bartender tools

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, SolutionSmall, DrinkBase]
  id: DrinkShaker
  name: shaker
  description: The trusty mixing buddy of the bartender.
  components:
  - type: Solution
    solution:
      maxVol: 90 # Shakers are often about 700ml give or take and I like weird sizes so.
  - type: FitsInDispenser
    solution: drink
  - type: ExaminableSolution
    heldOnly: true # Opaque, can't see inside from a distance
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shaker.rsi
    state: icon
  - type: Item
    sprite: Objects/Consumable/Drinks/shaker.rsi
    shape:
    - 0,0,0,2 # 3 tall
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
  - type: Shakeable
  - type: ReactionMixer
    mixerType: None
    reactionTypes:
    - Shake

- type: entity
  parent: DrinkShaker
  id: DrinkShakerGold
  name: golden shaker
  description: A gold-plated shaker given as a token of appreciation for years of service. It doesn't make the drinks taste any different.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shaker_gold.rsi
  - type: Item
    sprite: Objects/Consumable/Drinks/shaker_gold.rsi
  - type: PhysicalComposition
    materialComposition:
      Gold: 10 # Gold plated, not solid gold
      Steel: 40

- type: entity
  parent: [DrinkBaseMaterialMetal, DrinkBase]
  id: DrinkJigger
  name: jigger
  description: Like a shaker, but smaller. Used to control the amount of ingredients.
  components:
  - type: Item
    size: Tiny
  - type: Solution
    solution:
      maxVol: 10 # Two shot glasses in size
  - type: SolutionTransfer
    canChangeTransferAmount: true
    minTransferAmount: 1
    maxTransferAmount: 20
  - type: FitsInDispenser
    solution: drink
  - type: ExaminableSolution
    heldOnly: true
    exactVolume: true
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jigger.rsi
    state: icon
  - type: PhysicalComposition
    materialComposition:
      Steel: 20

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, SolutionNormal, DrinkBase, DrinkVisualsFill]
  id: Pitcher
  name: metal pitcher
  description: A stainless steel insulated pitcher. Everyone's best friend in the morning.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Consumable/Drinks/pitcher.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    inHandsMaxFillLevels: 2
  - type: FitsInDispenser
    solution: drink

