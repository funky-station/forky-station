- type: entity
  id: CigCartonGreen
  parent: [ BoxCardboard, BaseBagOpenClose ]
  name: Interdyne Respirols carton # Funky
  description: "A carton containing 6 packets of Interdyne Respirols." # Funky
  components:
  - type: Sprite
    sprite: _Funkystation/Objects/Consumable/Smokeables/Cigarettes/Cartons/green.rsi # Funky
    state: icon
  - type: Item
    sprite: _Funkystation/Objects/Consumable/Smokeables/Cigarettes/Cartons/green.rsi # Funky
    size: Normal
  - type: Storage
    grid:
    - 0,0,4,1
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigPackGreen
        amount: 5
  - type: Tag
    tags:
    - Trash
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
  - type: SpaceGarbage

